# Deployed PrizeCheck stack. Unraid dev uses this file alone; Oracle production adds compose.prod.yml when its env file
# says PRIZECHECK_ENVIRONMENT=prod. Each has its own env file, project name, data directory and port. Local
# development keeps using docker-compose.yml.
#
# Run through deploy/host/prizecheck-deploy.sh, which supplies --env-file and PRIZECHECK_IMAGE_TAG.
# See docs/deployment-unraid.md and docs/deployment-oracle.md.
name: ${PRIZECHECK_PROJECT:-prizecheck-dev}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-hardening: &app-hardening
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-api-environment: &api-environment
  DATABASE_URL: postgresql://prizecheck:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/prizecheck
  INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET is required}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  PUBLIC_PROJECTION_ADAPTER: filesystem
  PUBLIC_PROJECTION_DIR: /var/lib/prizecheck/public
  PRICE_RUNNER_LOCK_DIR: /var/lib/prizecheck/price-runners
  # Collector price kill switch (api/app/price_reads.py): `off` answers every price row unavailable without a query.
  PRICE_READS: ${PRICE_READS:-on}
  # Card art store (#358, ADR 0020): regenerable files, left out of backups.
  ART_STORE_DIR: /var/lib/prizecheck/art
  ART_FETCH_CONTACT: ${SCANNER_INDEX_CONTACT:-${OWNER_EMAIL}}
  # The release's commit: the API applies its newest catalog rules (ADR 0021).
  RELEASE_COMMIT: ${PRIZECHECK_IMAGE_TAG:-}
  # The owner panel shows the last day's new accounts against this cap; the auth gateway enforces it.
  DAILY_SIGNUP_CAP: ${DAILY_SIGNUP_CAP:-100}
  NODE_ENV: ${PRIZECHECK_NODE_ENV:-development}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: prizecheck
      POSTGRES_DB: prizecheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${PRIZECHECK_DATA_DIR:?PRIZECHECK_DATA_DIR is required}/postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U prizecheck -d prizecheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s

  api:
    <<: *app-hardening
    image: ${PRIZECHECK_REGISTRY:-ghcr.io/ry-cen}/prizecheck-api:${PRIZECHECK_IMAGE_TAG:?PRIZECHECK_IMAGE_TAG is required}
    # Catalog imports and price runners are detached children; an init process reaps them.
    init: true
    environment: *api-environment
    volumes:
      - ${PRIZECHECK_DATA_DIR}/public:/var/lib/prizecheck/public
      - ${PRIZECHECK_DATA_DIR}/price-runners:/var/lib/prizecheck/price-runners
      - ${PRIZECHECK_DATA_DIR}/art:/var/lib/prizecheck/art
    networks: [backend, egress]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s

  auth:
    <<: *app-hardening
    image: ${PRIZECHECK_REGISTRY:-ghcr.io/ry-cen}/prizecheck-auth:${PRIZECHECK_IMAGE_TAG}
    read_only: true
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgresql://prizecheck:${POSTGRES_PASSWORD}@db:5432/prizecheck
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL:?OWNER_EMAIL is required}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      API_ORIGIN: http://api:8000
      AUTH_HOST: 0.0.0.0
      AUTH_PORT: "3001"
      # Fake (file) mail is refused under NODE_ENV=production; production must use MAIL_MODE=http.
      NODE_ENV: ${PRIZECHECK_NODE_ENV:-development}
      MAIL_MODE: ${MAIL_MODE:-file}
      MAIL_FILE: /var/lib/prizecheck/mail/codes.jsonl
      MAIL_RELAY_URL: ${MAIL_RELAY_URL:-}
      MAIL_RELAY_TOKEN: ${MAIL_RELAY_TOKEN:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # The host script computes PRIZECHECK_SIGNUP_MODE for every call (owner-only unless the env file asks for public and
      # the readiness proof is valid for this release's commit; docs/signup-readiness.md). Never read from the env file.
      SIGNUP_MODE: ${PRIZECHECK_SIGNUP_MODE:-owner-only}
      RELEASE_COMMIT: ${PRIZECHECK_IMAGE_TAG:-}
      SIGNUP_READINESS_FILE: /run/prizecheck/signup/${PRIZECHECK_IMAGE_TAG:-none}.json
      # Email-code sign-in is off unless EMAIL_SIGN_IN=on. With no provider credentials and email off the gateway refuses
      # to start, so keep EMAIL_SIGN_IN=on in the env file until Google or Discord is registered (spec launch checklist).
      EMAIL_SIGN_IN: ${EMAIL_SIGN_IN:-off}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DAILY_SEND_CAP: ${DAILY_SEND_CAP:-100}
      # New OAuth accounts per rolling day, app-wide; the API reads the same variable for the owner panel.
      DAILY_SIGNUP_CAP: ${DAILY_SIGNUP_CAP:-100}
      TRUSTED_PROXY_IPS: ""
    volumes:
      - ${PRIZECHECK_DATA_DIR}/mail:/var/lib/prizecheck/mail
    networks: [backend, edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Through the gateway to the API: proves both processes and their link.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    <<: *app-hardening
    image: ${PRIZECHECK_REGISTRY:-ghcr.io/ry-cen}/prizecheck-web:${PRIZECHECK_IMAGE_TAG}
    read_only: true
    tmpfs: [/tmp]
    # The only published port. Loopback by default, for Tailscale Serve on the Unraid host.
    ports:
      - "${PRIZECHECK_WEB_BIND:-127.0.0.1}:${PRIZECHECK_WEB_PORT:-8088}:8080"
    networks:
      edge: {}
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # One-off operator and migration commands, e.g. `run --rm tools /app/scripts/migrate.py`.
  tools:
    image: ${PRIZECHECK_REGISTRY:-ghcr.io/ry-cen}/prizecheck-api:${PRIZECHECK_IMAGE_TAG}
    profiles: [tools]
    init: true
    entrypoint: ["python"]
    command: ["--version"]
    environment:
      <<: *api-environment
      # The price import names this contact in its User-Agent and refuses to run without one.
      PRICE_IMPORT_CONTACT: ${PRICE_IMPORT_CONTACT:-${OWNER_EMAIL}}
    volumes:
      - ${PRIZECHECK_DATA_DIR}/public:/var/lib/prizecheck/public
      - ${PRIZECHECK_DATA_DIR}/price-runners:/var/lib/prizecheck/price-runners
    networks: [backend, egress]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # The card scanner's fingerprint index job (#312): run by hand after a catalog pull, never started by `up`:
  # `compose run --rm scanner-index` (add `--full` to refetch every image). It shares only the database with the API and
  # fetches reference art from assets.tcgdex.net, so it gets the egress network but none of the API's secrets. The
  # User-Agent carries the contact below (SCANNER_INDEX_CONTACT in the env file, else the owner's email).
  scanner-index:
    image: ${PRIZECHECK_REGISTRY:-ghcr.io/ry-cen}/prizecheck-scanner-index:${PRIZECHECK_IMAGE_TAG}
    profiles: [tools]
    init: true
    read_only: true
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgresql://prizecheck:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/prizecheck
      SCANNER_INDEX_CONTACT: ${SCANNER_INDEX_CONTACT:-${OWNER_EMAIL}}
    networks: [backend, egress]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  # PostgreSQL and the API's private listener: no route outside the host.
  backend:
    internal: true
  # Outbound access for catalog/price imports (TCGdex) and an HTTP mail relay.
  egress: {}
  # The gateway and the browser-facing web service.
  edge: {}
