# Pokémon TCG Standard format rules, read by api/app/format_evaluator.py.
#
# Maintenance (by commit only):
#   - Every change bumps `revision` and sets `published` to the day of the change. The rules version a check reports
#     is "<revision> (<published>)". Then re-pin the file in api/tests/test_format_rules.py (PINNED_RULES).
#   - Every regulation mark and set entry carries a date. `legal_from` is the first day something is legal;
#     `rotates_on` is the first day a mark is no longer legal (so G is legal on 2026-04-09 and not on 2026-04-10).
#   - These rules describe Standard from `covers_from` on. A check for an earlier date is unknown. A mark already
#     legal at `covers_from` has legal_from = covers_from; a mark already rotated has legal_from = rotates_on =
#     covers_from.
#   - Every set in imported_sets.txt is listed exactly once: in [[sets]] with its legal-from date, or in an
#     [[excluded_sets]] group. A set in neither (a newly imported set) checks as unknown.
#   - A set's legal-from date is the second Friday after its US release (TCG Tournament Handbook). basis =
#     "second_friday" means legal_from was computed that way from `released` (the TCGdex releaseDate), and the gate
#     test recomputes it. basis = "announced" means an announcement set another date; `reference` cites it.
#   - Sources: research in docs/planning/deck-format-validation/wayfinder/research/standard-and-expanded-rules.md and
#     tcgdex-legality-data.md. TCGdex `legal` flags are never used.

format = "standard"
name = "Standard"
revision = 1
published = 2026-10-11
covers_from = 2025-04-11  # The 2025 rotation (F out) took effect at in-person events on 2025-04-11.

# How a printing enters the card pool. "mark_and_set": a legal regulation mark on the date AND a set whose legal-from
# date has passed. Basic Energy is legal regardless of either.
pool = "mark_and_set"
basic_energy_always_legal = true

# Whether a Pokémon printing may be legal through a legal printing in its Reprint Group. Off: no primary source says it
# may (decide-reprint-groups.md). Trainers and Energy always may (ticket 13).
pokemon_reprint_inheritance = false

# No card is banned in Standard (Pokémon TCG Banned Card List, read 2026-10-10).
bans = []

[limits]
deck_size = 60            # exactly
copies = 4                # per Card Identity
basic_energy_exempt = true
ace_spec_per_deck = 1
radiant_per_deck = 1
prism_star_per_name = 1   # per Card Identity

# D, E and F were out of Standard before covers_from (F rotated on 2025-04-11).
[[regulation_marks]]
mark = "D"
legal_from = 2025-04-11
rotates_on = 2025-04-11

[[regulation_marks]]
mark = "E"
legal_from = 2025-04-11
rotates_on = 2025-04-11

[[regulation_marks]]
