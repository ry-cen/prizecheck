legal_from = 2025-04-11
rotates_on = 2025-04-11

# 2026 rotation, announced 2026-01-09; in-person events from 2026-04-10.
[[regulation_marks]]
mark = "G"
legal_from = 2025-04-11
rotates_on = 2026-04-10

[[regulation_marks]]
mark = "H"
legal_from = 2025-04-11

# I entered Standard with Journey Together on 2025-04-11.
