# Gym Leader Challenge format rules, read by api/app/format_evaluator.py.
#
# Maintenance (by commit only), as in standard.toml: every change bumps `revision`, sets `published`, and re-pins the
# file in api/tests/test_format_rules.py (PINNED_RULES). Every set in imported_sets.txt is listed exactly once: in
# [[sets]], [[excluded_sets]] or [[unsettled_sets]].
#
# Gym Leader Challenge is a fan-made format maintained by Andrew Mahone (Tricky Gym). Sources (read 2026-10-11):
#   - Rules (gymleaderchallenge.com/rules): one Pokémon type; one copy of each card name except Basic Energy; no Rule
#     Box cards; no ACE SPEC cards; Black & White onward plus a short ban list; 60 cards.
#   - FAQ and Rulings (gymleaderchallenge.com/faq): Rule Box covers Pokémon V, EX, GX, BREAK, Radiant Pokémon, ACE SPECs
#     and Prism Star cards; dual-type Pokémon fit either type; one Boss's Orders OR Lysandre, and one Professor's
#     Research OR Professor Sycamore OR Professor Juniper ("the only cards affected"); the official Reprint and Errata
#     Legality List applies; Classic Collection cards only when they reprint Black & White-onward cards; set legality
#     follows the event region (organizers may allow new sets at once).
#   - Colorless page (gymleaderchallenge.com/colorless): "Colorless is its own type".
#   - Ban List (gymleaderchallenge.com/ban-list), each ban with its effective date; the news index lists no change after
#     "Dimension Valley Banned" (2026-04-06, effective 2026-04-20).
#   - Research notes in docs/planning/deck-format-validation/wayfinder/research/gym-leader-challenge-rules.md.

format = "glc"
name = "Gym Leader Challenge"
revision = 1
published = 2026-10-11
# GLC Update 1.6 took effect on 2025-04-24; every later change (Dimension Valley) is on the ban list with its date.
covers_from = 2025-04-24

# "by_set": every Black & White-onward set admits its printings by itself once its legal-from date (the official one)
# has passed; regulation marks play no part, and GLC does not rotate. Products the official pool admits only by a
# regulation mark that TCGdex does not record are unsettled below.
pool = "by_set"
basic_energy_always_legal = true
pokemon_reprint_inheritance = false
regulation_marks = []

# Cards whose Rule Box or ACE SPEC status is true are not legal (Rule Box includes Radiant and Prism Star cards).
excluded_attributes = ["rule_box", "ace_spec"]
# Every Pokémon shares one type; Trainers and Energy have none. A dual-type Pokémon fits either type.
single_pokemon_type = true

# GLC's own ban list, by TCGdex set ID and collector number; Expanded's list does not apply. Bans in force before
# covers_from carry covers_from as banned_from; their reasons then name no date.
bans = [
  # Lysandre's Trump Card: effective 2021-11-16 (Update 1.0).
  { set = "xy4", number = "99", name = "Lysandre's Trump Card", banned_from = 2025-04-24 },
  { set = "xy4", number = "118", name = "Lysandre's Trump Card", banned_from = 2025-04-24 },
  # Oranguru: effective 2021-11-16 (Update 1.0).
  { set = "sm5", number = "114", name = "Oranguru", banned_from = 2025-04-24 },
  # Forest of Giant Plants: effective 2022-01-10 (Update 1.1).
  { set = "xy7", number = "74", name = "Forest of Giant Plants", banned_from = 2025-04-24 },
  # Chip-Chip Ice Axe: effective 2022-06-08 (Update 1.2).
  { set = "sm10", number = "165", name = "Chip-Chip Ice Axe", banned_from = 2025-04-24 },
  # Hiker: effective 2022-06-08 (Update 1.2).
  { set = "sm7", number = "133", name = "Hiker", banned_from = 2025-04-24 },
  { set = "sma", number = "SV85", name = "Hiker", banned_from = 2025-04-24 },
  # Kyogre: effective 2022-11-11 (Update 1.3); Shining Fates 021 only.
  { set = "swsh4.5", number = "21", name = "Kyogre", banned_from = 2025-04-24 },
  # Pokémon Research Lab: effective 2023-11-01 (Update 1.4).
  { set = "sm11", number = "205", name = "Pokémon Research Lab", banned_from = 2025-04-24 },
  # Raikou: effective 2024-09-01 (Update 1.5); Vivid Voltage 050 only.
  { set = "swsh4", number = "50", name = "Raikou", banned_from = 2025-04-24 },
  # Marshadow: effective 2024-09-01 (Update 1.5).
  { set = "sm3.5", number = "45", name = "Marshadow", banned_from = 2025-04-24 },
  { set = "smp", number = "SM85", name = "Marshadow", banned_from = 2025-04-24 },
  # Duskull: effective 2024-09-01 (Update 1.5).
  { set = "sm12", number = "83", name = "Duskull", banned_from = 2025-04-24 },
  # Double Colorless Energy: effective 2025-04-24 (Update 1.6): Shining Legends 69 "and all other versions", so every Black & White-onward printing.
  { set = "sm3.5", number = "69", name = "Double Colorless Energy", banned_from = 2025-04-24 },
  { set = "bw4", number = "92", name = "Double Colorless Energy", banned_from = 2025-04-24 },
  { set = "bw11", number = "113", name = "Double Colorless Energy", banned_from = 2025-04-24 },
  { set = "xy1", number = "130", name = "Double Colorless Energy", banned_from = 2025-04-24 },
  { set = "xy4", number = "111", name = "Double Colorless Energy", banned_from = 2025-04-24 },
  { set = "g1", number = "74", name = "Double Colorless Energy", banned_from = 2025-04-24 },
  { set = "xy10", number = "114", name = "Double Colorless Energy", banned_from = 2025-04-24 },
  { set = "xy12", number = "90", name = "Double Colorless Energy", banned_from = 2025-04-24 },
  { set = "sm1", number = "136", name = "Double Colorless Energy", banned_from = 2025-04-24 },
  { set = "sm2", number = "166", name = "Double Colorless Energy", banned_from = 2025-04-24 },
  # Twin Energy: effective 2025-04-24 (Update 1.6).
  { set = "swsh2", number = "174", name = "Twin Energy", banned_from = 2025-04-24 },
  { set = "swsh2", number = "209", name = "Twin Energy", banned_from = 2025-04-24 },
  # Dimension Valley: effective 2026-04-20 ("Dimension Valley Banned", 2026-04-06).
  { set = "xy4", number = "93", name = "Dimension Valley", banned_from = 2026-04-20 },
]

[limits]
deck_size = 60            # exactly
copies = 1                # per Card Identity, or per copy group below
basic_energy_exempt = true
ace_spec_per_deck = 0     # ACE SPEC cards are excluded outright
radiant_per_deck = 0      # Radiant Pokémon have a Rule Box
prism_star_per_name = 0   # Prism Star cards have a Rule Box

# Card Identities that share one copy (FAQ: official Pokémon TCG rulings).
[[copy_groups]]
names = ["Boss's Orders", "Lysandre"]

[[copy_groups]]
names = ["Professor's Research", "Professor Sycamore", "Professor Juniper"]

