name: Deploy dev
# Push to dev -> full verification gate -> images in GHCR tagged with the commit -> Tailscale -> forced-command SSH
# to the Unraid host, which pulls, backs up, migrates, starts and checks the release (deploy/unraid/prizecheck-deploy.sh).
# One-time setup: docs/deployment-unraid.md.
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      operation:
        description: "deploy: verify, build and deploy this dev commit. rollback: return the host to its previous release."
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions: {}

env:
  REGISTRY: ghcr.io/ry-cen

jobs:
  verify:
    if: github.ref == 'refs/heads/dev' && inputs.operation != 'rollback'
    uses: ./.github/workflows/verify.yml
    # The fast tier: the slow capacity and timing tests are unreliable on hosted runners and would block deploys at
    # random. The full gate still runs on the same push through verify.yml's own push trigger, without blocking.
    with:
      fast: true
    permissions:
      contents: read

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [api, auth, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          push: true
          # The commit tag is what the host deploys; `dev` is only a convenience pointer.
          tags: |
            ${{ env.REGISTRY }}/prizecheck-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/prizecheck-${{ matrix.service }}:dev
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=prizecheck-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=prizecheck-${{ matrix.service }}

  deploy:
    needs: images
    # Off until the one-time host, Tailscale and secret setup is done: set the repository variable DEV_DEPLOY_ENABLED=true.
    if: vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Above the host script's worst case (lock wait, pull, backup, migration, health waits, restore), so the job
    # doesn't give up on a deploy that is still running on Unraid.
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ vars.DEV_PUBLIC_URL }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Skip superseded commits
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/dev" --jq .commit.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "dev is now at $head; that run deploys instead of $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.current == 'true'
        with:
          persist-credentials: false
      - name: Host file digest
        if: steps.head.outputs.current == 'true'
        id: bundle
        run: echo "digest=$(cat compose.deploy.yml deploy/unraid/prizecheck-deploy.sh | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        if: steps.head.outputs.current == 'true'
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.UNRAID_SSH_HOST }}
      - name: Configure SSH
        if: steps.head.outputs.current == 'true'
        env:
          SSH_KEY: ${{ secrets.UNRAID_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.UNRAID_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prizecheck_deploy
          chmod 600 ~/.ssh/prizecheck_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy on Unraid
        if: steps.head.outputs.current == 'true'
        env:
          HOST: ${{ vars.UNRAID_SSH_HOST }}
          SSH_USER: ${{ vars.UNRAID_SSH_USER || 'root' }}
          BUNDLE: ${{ steps.bundle.outputs.digest }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          # The token travels on stdin for one read-only GHCR login that the host deletes after the pull.
          printf '%s %s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | ssh -i ~/.ssh/prizecheck_deploy \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$SSH_USER@$HOST" "deploy $GITHUB_SHA $BUNDLE"
          echo "Deployed \`$GITHUB_SHA\` to dev." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/prizecheck_deploy

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && github.ref == 'refs/heads/dev' && vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: ${{ vars.DEV_PUBLIC_URL }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions: {}
    steps:
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.UNRAID_SSH_HOST }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.UNRAID_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.UNRAID_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prizecheck_deploy
          chmod 600 ~/.ssh/prizecheck_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Roll back on Unraid
        env:
          HOST: ${{ vars.UNRAID_SSH_HOST }}
          SSH_USER: ${{ vars.UNRAID_SSH_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/prizecheck_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$SSH_USER@$HOST" rollback < /dev/null
          echo "Rolled dev back to its previous release." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/prizecheck_deploy
