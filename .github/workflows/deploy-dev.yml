name: Deploy dev
# Manual only (Actions -> Deploy dev -> Run workflow on dev): a push to dev deploys nothing. The default checks and
# multi-arch images in GHCR tagged with the commit (build-images.yml) -> Tailscale -> forced-command SSH to the Unraid
# host, which pulls, backs up, migrates, starts and checks the release (deploy/host/prizecheck-deploy.sh). Production
# (deploy-prod.yml) reuses these images when they exist and builds them the same way when they don't.
# One-time setup: docs/deployment-unraid.md.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "deploy: verify, build and deploy this dev commit. rollback: return the host to its previous release."
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/dev' && inputs.operation != 'rollback'
    uses: ./.github/workflows/build-images.yml
    with:
      pointer: dev
    permissions:
      contents: read
      packages: write

  deploy:
    needs: build
    # Off until the one-time host, Tailscale and secret setup is done: set the repository variable DEV_DEPLOY_ENABLED=true.
    if: vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Above the host script's worst case (lock wait, pull, backup, migration, health waits, restore), so the job
    # doesn't give up on a deploy that is still running on Unraid.
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ vars.DEV_PUBLIC_URL }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host file digest
        id: bundle
        run: echo "digest=$(cat compose.deploy.yml deploy/host/prizecheck-deploy.sh deploy/host/prizecheck-catalog-refresh.service deploy/host/prizecheck-catalog-refresh.timer deploy/host/prizecheck-backup.service deploy/host/prizecheck-backup.timer | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.UNRAID_SSH_HOST }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.UNRAID_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.UNRAID_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prizecheck_deploy
          chmod 600 ~/.ssh/prizecheck_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy on Unraid
        env:
          HOST: ${{ vars.UNRAID_SSH_HOST }}
          SSH_USER: ${{ vars.UNRAID_SSH_USER || 'root' }}
          BUNDLE: ${{ steps.bundle.outputs.digest }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          # The token travels on stdin for one read-only GHCR login that the host deletes after the pull.
          printf '%s %s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | ssh -i ~/.ssh/prizecheck_deploy \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$SSH_USER@$HOST" "deploy $GITHUB_SHA $BUNDLE"
          echo "Deployed \`$GITHUB_SHA\` to dev." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/prizecheck_deploy

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && github.ref == 'refs/heads/dev' && vars.DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: ${{ vars.DEV_PUBLIC_URL }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions: {}
    steps:
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.UNRAID_SSH_HOST }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.UNRAID_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.UNRAID_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prizecheck_deploy
          chmod 600 ~/.ssh/prizecheck_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Roll back on Unraid
        env:
          HOST: ${{ vars.UNRAID_SSH_HOST }}
          SSH_USER: ${{ vars.UNRAID_SSH_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/prizecheck_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$SSH_USER@$HOST" rollback < /dev/null
          echo "Rolled dev back to its previous release." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/prizecheck_deploy
