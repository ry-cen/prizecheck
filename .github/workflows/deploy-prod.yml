name: Deploy prod
# Push to main -> reuse this commit's multi-arch images if a manual Deploy dev built them, otherwise build them here with
# the same default checks (build-images.yml) -> Tailscale (tag:ci-prod) -> forced-command SSH to the Oracle host, which
# pulls, backs up, migrates, starts and checks the release (deploy/host/prizecheck-deploy.sh) -> public site check.
# One-time setup: docs/deployment-oracle.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "deploy: deploy this main commit, building its images first if they don't exist. rollback: return the host to its previous release."
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions: {}

env:
  REGISTRY: ghcr.io/ry-cen

jobs:
  images:
    name: Find this commit's images
    if: vars.PROD_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && inputs.operation != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: read
    outputs:
      missing: ${{ steps.find.outputs.missing }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Look for linux/arm64 images of this commit
        id: find
        run: |
          missing=()
          for service in api auth web scanner-index; do
            platforms="$(docker buildx imagetools inspect --raw "$REGISTRY/prizecheck-$service:$GITHUB_SHA" 2>/dev/null \
              | jq -r '[.manifests[]?.platform | select(. != null) | "\(.os)/\(.architecture)"] | join(" ")' || true)"
            case " $platforms " in *" linux/arm64 "*) ;; *) missing+=("$service") ;; esac
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Reusing the images a dev deploy built for \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "No linux/arm64 image for ${missing[*]} at \`$GITHUB_SHA\`; building them." >> "$GITHUB_STEP_SUMMARY"
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: images
    if: vars.PROD_DEPLOY_ENABLED == 'true' && needs.images.outputs.missing == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      pointer: main
    permissions:
      contents: read
      packages: write

  deploy:
    needs: [images, build]
    # Off until the one-time host, DNS, Tailscale and secret setup is done: set the repository variable PROD_DEPLOY_ENABLED=true.
    # The build job is skipped when the images already exist, so the deploy accepts a skipped or successful build.
    if: ${{ !cancelled() && vars.PROD_DEPLOY_ENABLED == 'true' && needs.images.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Above the host script's worst case (lock wait, pull, backup, migration, health waits, restore), so the job
    # doesn't give up on a deploy that is still running on the Oracle host.
    timeout-minutes: 30
    environment:
      name: prod
      url: ${{ vars.PROD_PUBLIC_URL }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Skip superseded commits
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is now at $head; that run deploys instead of $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.current == 'true'
        with:
          persist-credentials: false
      - name: Host file digest
        if: steps.head.outputs.current == 'true'
        id: bundle
        run: echo "digest=$(cat compose.deploy.yml compose.prod.yml deploy/host/prizecheck-deploy.sh | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        if: steps.head.outputs.current == 'true'
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-prod
          ping: ${{ vars.PROD_SSH_HOST }}
      - name: Configure SSH
        if: steps.head.outputs.current == 'true'
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prizecheck_prod_deploy
          chmod 600 ~/.ssh/prizecheck_prod_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy on the Oracle host
        if: steps.head.outputs.current == 'true'
        env:
          HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_USER: ${{ vars.PROD_SSH_USER || 'root' }}
          BUNDLE: ${{ steps.bundle.outputs.digest }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          # The token travels on stdin for one read-only GHCR login that the host deletes after the pull.
          printf '%s %s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | ssh -i ~/.ssh/prizecheck_prod_deploy \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$SSH_USER@$HOST" "deploy $GITHUB_SHA $BUNDLE"
          echo "Deployed \`$GITHUB_SHA\` to prod." >> "$GITHUB_STEP_SUMMARY"
      - name: Check the public site
        if: steps.head.outputs.current == 'true'
        env:
          PUBLIC_URL: ${{ vars.PROD_PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "::error::Set the repository variable PROD_PUBLIC_URL"
            exit 1
          fi
          # Proves DNS, Caddy, TLS and the stack end to end from outside the host.
          headers="$(curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 15 -D - -o /dev/null "${PUBLIC_URL%/}/api/health")"
          if ! grep -qi '^strict-transport-security:' <<<"$headers"; then
            echo "::warning::${PUBLIC_URL%/} does not send Strict-Transport-Security; check the Caddyfile"
          fi
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/prizecheck_prod_deploy

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback' && github.ref == 'refs/heads/main' && vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: prod
      url: ${{ vars.PROD_PUBLIC_URL }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions: {}
    steps:
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-prod
          ping: ${{ vars.PROD_SSH_HOST }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prizecheck_prod_deploy
          chmod 600 ~/.ssh/prizecheck_prod_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Roll back on the Oracle host
        env:
          HOST: ${{ vars.PROD_SSH_HOST }}
          SSH_USER: ${{ vars.PROD_SSH_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/prizecheck_prod_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "$SSH_USER@$HOST" rollback < /dev/null
          echo "Rolled prod back to its previous release." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/prizecheck_prod_deploy
