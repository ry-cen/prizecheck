name: Verify
on:
  # Pull requests, and each image build through build-images.yml's call (manual dev deploys, and prod releases that no
  # dev deploy built). No push trigger: branches are checked when their pull request opens.
  pull_request:
  # The default checks (formatting, lint, compilation, build, unit tests) are what an automatic run does, except on a
  # pull request to main (a release), which also runs the sharded integration suites. Otherwise the deep integration
  # suites (PostgreSQL-backed API tests, the auth server tests and Playwright) run only on demand: Actions -> Verify ->
  # Run workflow, with an integration choice other than none. The default checks run in that run too. build-images.yml's
  # call is not a pull request, so it runs the default checks only.
  workflow_dispatch:
    inputs:
      integration:
        description: "Also run the deep integration suites: sharded (API, auth, Playwright and scanner real-model legs) or full (one unsharded npm run verify, slow tests and the operations suite included, plus the scanner real-model test)"
        type: choice
        options:
          - none
          - sharded
          - full
        default: none
  workflow_call:
permissions:
  contents: read
jobs:
  # The default checks, in one job: no database and no browser. A pull request needs the same npm and Python installs
  # for every step, so one job pays for them once. Each step is named for the check it runs.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      # check:client and guardrails run from .venv.
      - run: python -m venv .venv && .venv/bin/pip install -r api/requirements.txt
      - name: Format
        run: npx prettier --check .
      - name: Lint (guardrails and the tooling tests)
        run: npm run guardrails
      - name: Compile (TypeScript, scanner models lock, generated clients, Python byte-compile)
        run: npm run check && .venv/bin/python -m compileall -q api scripts
      - name: Build (the web bundle and its boundary)
        run: npx vite build --config web/vite.config.ts && npm run check:bundle
      - name: Unit tests
        run: npm run test:unit
  # Optional (integration: sharded, and every pull request to main). The fast tier of the deep suites, split into legs
  # that run at once, each on its own runner with its own database server and stacks: three shards of api/tests, the
  # auth leg (guardrails, the build and vitest, run once for every leg) and ten shards of the Playwright specs
  # (scripts/verify.py --shard). On one hosted runner the fast tier took about 32 minutes, 22 of them in Playwright
  # (October 2026); a leg takes about 5. inputs.integration is empty on pull_request and workflow_call, so these jobs
  # run there only for a pull request to main.
  integration-legs:
    if: ${{ inputs.integration == 'sharded' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    name: ${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every leg runs to the end, so one leg's failure doesn't hide another's.
      fail-fast: false
      matrix:
        include:
          - leg: api-1
            args: --suite api --fast --shard 1/3
          - leg: api-2
            args: --suite api --fast --shard 2/3
          - leg: api-3
            args: --suite api --fast --shard 3/3
          - leg: auth
            args: --suite auth --fast
            browsers: true
          - leg: browser-1
            args: --suite browser --fast --shard 1/10
            browsers: true
          - leg: browser-2
            args: --suite browser --fast --shard 2/10
            browsers: true
          - leg: browser-3
            args: --suite browser --fast --shard 3/10
            browsers: true
          - leg: browser-4
            args: --suite browser --fast --shard 4/10
            browsers: true
          - leg: browser-5
            args: --suite browser --fast --shard 5/10
            browsers: true
          - leg: browser-6
            args: --suite browser --fast --shard 6/10
            browsers: true
          - leg: browser-7
            args: --suite browser --fast --shard 7/10
            browsers: true
          - leg: browser-8
            args: --suite browser --fast --shard 8/10
            browsers: true
          - leg: browser-9
            args: --suite browser --fast --shard 9/10
            browsers: true
          - leg: browser-10
            args: --suite browser --fast --shard 10/10
            browsers: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      # The api legs start no browser, so they skip the download.
      - if: ${{ matrix.browsers }}
        run: npx playwright install --with-deps chromium
      - name: Chromium sandbox preflight (fail closed)
        if: ${{ matrix.browsers }}
        run: node scripts/browser_sandbox_preflight.mjs
      - run: npm run verify -- ${{ matrix.args }}
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.leg }}
          path: .scratch/verification/
          retention-days: 7
          include-hidden-files: true
  # Optional (integration: full). The full gate, unsharded.
  integration-full:
    if: ${{ inputs.integration == 'full' }}
    runs-on: ubuntu-latest
    # Well above the unsharded fast tier's 32 minutes on a hosted runner, since the full gate adds the slow tests and
    # the operations suite.
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npx playwright install --with-deps chromium
      - name: Chromium sandbox preflight (fail closed)
        run: node scripts/browser_sandbox_preflight.mjs
      - run: npm run verify
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: .scratch/verification/
          retention-days: 7
          include-hidden-files: true
  # The scanner index job's image (deploy/docker/scanner-index.Dockerfile): a build check of the job image, on both
  # architectures because production runs the arm64 image. The image's default stage does not depend on the test stage,
  # so the real-model test is not built or run here; integration-scanner-model does that on demand. build-images.yml
  # pushes the same image once this workflow has passed.
  scanner-index-image:
    name: scanner-index-image (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            cache: ""
          - runner: ubuntu-24.04-arm
            cache: "-arm64"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the job image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/scanner-index.Dockerfile
          push: false
          cache-from: type=gha,scope=prizecheck-scanner-index${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=prizecheck-scanner-index${{ matrix.cache }}
  # Optional (integration: sharded or full, and every pull request to main). Builds the Dockerfile's test stage with the pinned embedder and runs the
  # real-model test inside it. That test needs ONNX Runtime, which the API venv does not have, so no other job runs it.
  integration-scanner-model:
    if: ${{ inputs.integration == 'sharded' || inputs.integration == 'full' || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    name: integration-scanner-model (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            cache: ""
          - runner: ubuntu-24.04-arm
            cache: "-arm64"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the test stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/scanner-index.Dockerfile
          target: test
          load: true
          tags: prizecheck-scanner-index-test
          cache-from: type=gha,scope=prizecheck-scanner-index-test${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=prizecheck-scanner-index-test${{ matrix.cache }}
      - name: Real-model test
        run: docker run --rm prizecheck-scanner-index-test
  # The one check that stands for the whole run: pull requests and build-images.yml's images job wait on "verify".
  # always() makes it run and fail after a failed or cancelled job instead of being skipped with it, because a skipped
  # check counts as passing. The default checks must always succeed. Each optional job must succeed when this run asked
  # for it, by the dispatch input or by a pull request to main, and must be skipped when it did not, so a job skipped by a wrong condition fails here instead of passing.
  verify:
    needs:
      [
        checks,
        scanner-index-image,
        integration-legs,
        integration-full,
        integration-scanner-model,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the default checks, and every requested integration job, to have passed
        env:
          INTEGRATION: ${{ inputs.integration || 'none' }}
          RELEASE_PR: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'true' || 'false' }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          SCANNER_INDEX_RESULT: ${{ needs.scanner-index-image.result }}
          LEGS_RESULT: ${{ needs.integration-legs.result }}
          FULL_RESULT: ${{ needs.integration-full.result }}
          SCANNER_MODEL_RESULT: ${{ needs.integration-scanner-model.result }}
        run: |
          echo "integration: $INTEGRATION; release pull request: $RELEASE_PR; checks: $CHECKS_RESULT; scanner index image: $SCANNER_INDEX_RESULT; legs: $LEGS_RESULT; full: $FULL_RESULT; scanner model: $SCANNER_MODEL_RESULT"
          test "$CHECKS_RESULT" = success
          test "$SCANNER_INDEX_RESULT" = success
          # A pull request to main (a release) is due the sharded legs even though no input was set.
          if [ "$RELEASE_PR" = true ] && [ "$INTEGRATION" = none ]; then INTEGRATION=sharded; fi
          case "$INTEGRATION" in
            none) legs=skipped; full=skipped; model=skipped ;;
            sharded) legs=success; full=skipped; model=success ;;
            full) legs=skipped; full=success; model=success ;;
            *) echo "unknown integration choice: $INTEGRATION"; exit 1 ;;
          esac
          test "$LEGS_RESULT" = "$legs"
          test "$FULL_RESULT" = "$full"
          test "$SCANNER_MODEL_RESULT" = "$model"
