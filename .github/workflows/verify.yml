name: Verify
on:
  # Pull requests, and each dev deploy through deploy-dev.yml's call. No push trigger: a push to dev already runs this
  # workflow as the deploy gate, and other branches are checked when their pull request opens.
  pull_request:
  # Every automatic run is the fast tier: the slow capacity and timing tests fail at random on hosted runners.
  # Run the full gate on demand from Actions -> Verify -> Run workflow, or locally with `npm run verify`.
  # The burn-in of changed tests (npm run verify -- --burn-in) is a local gate before the pull request, not a CI job.
  workflow_dispatch:
    inputs:
      full:
        description: Run the full gate (slow tests and the operations suite included)
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # A passing full gate takes about 19 minutes on a hosted runner.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npx playwright install --with-deps chromium
      - run: npm run verify${{ !inputs.full && ' -- --fast' || '' }}
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: .scratch/verification/
          retention-days: 7
          include-hidden-files: true
