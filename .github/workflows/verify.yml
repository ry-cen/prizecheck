name: Verify
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: .scratch/verification/
          retention-days: 7
          include-hidden-files: true
