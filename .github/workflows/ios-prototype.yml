name: iOS prototype simulator
on:
  pull_request:
    branches: [dev, feature/ios-shell-signin-prototype]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ios-prototype.yml"
      - "mobile/**"
      - "web/src/shell/ios/**"
      - "capacitor.config.ts"
      - "package*.json"
permissions:
  contents: read
concurrency:
  group: ios-prototype-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  simulator:
    if: >-
      github.repository == 'ry-cen/prizecheck' &&
      github.event.repository.private == false &&
      (
        (github.event.pull_request.number == 671 && github.head_ref == 'feature/ios-shell-signin-prototype' && github.base_ref == 'dev') ||
        (github.event.pull_request.number == 676 && github.head_ref == 'feature/ios-native-sign-in' && github.base_ref == 'feature/ios-shell-signin-prototype')
      ) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record exact head and installed Xcode
        run: |
          git rev-parse HEAD
          xcodebuild -version
          xcrun swift --version
          xcrun simctl list runtimes
      - name: Start simulator boot early
        run: bash mobile/boot-simulator.sh
      - run: npm ci
      - run: npm run ios:sync
      - name: Compile unsigned app and UI tests through Swift Package Manager
        run: |
          set -o pipefail
          mkdir -p .scratch
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme FixtureValidation \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .scratch/ios-derived \
            CODE_SIGNING_ALLOWED=NO build-for-testing | tee .scratch/ios-build.log
      - name: Install, launch and exercise real simulator UI and bridge
        run: bash mobile/validate-simulator.sh
