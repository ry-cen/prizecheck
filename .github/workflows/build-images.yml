name: Build images
# The default checks, then per-architecture images (built natively) joined into multi-arch images in GHCR tagged with
# the commit. Called by Deploy dev for each manual dev deploy, and by Deploy prod when no dev deploy built the release
# commit, so every deployed image passed the same checks.
on:
  workflow_call:
    inputs:
      pointer:
        description: "The moving tag set alongside the commit tag: dev or main."
        type: string
        required: true

permissions: {}

env:
  REGISTRY: ghcr.io/ry-cen

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    # verify.yml runs only its default checks when called (formatting, lint, compilation, build, unit tests); the deep
    # integration suites run on demand.
    permissions:
      contents: read

  images:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [api, auth, web, scanner-index]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            cache: ""
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: "-arm64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          # Each runner builds its own architecture natively (QEMU would make the builds several times slower); the
          # `manifests` job joins the two tags into the commit tag the hosts deploy.
          tags: ${{ env.REGISTRY }}/prizecheck-${{ matrix.service }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: GIT_COMMIT=${{ github.sha }}
          # One cache scope per architecture: two in one scope would overwrite each other.
          cache-from: type=gha,scope=prizecheck-${{ matrix.service }}${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=prizecheck-${{ matrix.service }}${{ matrix.cache }}

  manifests:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [api, auth, web, scanner-index]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the architectures
        env:
          SERVICE: ${{ matrix.service }}
          POINTER: ${{ inputs.pointer }}
        run: |
          repo="$REGISTRY/prizecheck-$SERVICE"
          # The commit tag the hosts deploy, now one index for both architectures; the pointer (`dev` or `main`) is a
          # convenience tag nothing reads, moved only by the workflow that built (a prod release reusing dev's images
          # leaves `main` where it was).
          docker buildx imagetools create -t "$repo:$GITHUB_SHA" -t "$repo:$POINTER" "$repo:$GITHUB_SHA-amd64" "$repo:$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$repo:$GITHUB_SHA"
