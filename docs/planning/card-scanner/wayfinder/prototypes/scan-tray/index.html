<!doctype html>
<!--
  PROTOTYPE, throw me away. Scan tray for card scanner map ticket 3. Simulated camera; no artwork; nothing saved. Icons: Lucide (ISC).
  Colours and spacing come from web/src/tokens.css. Phone rules use the container query on .app, because the viewport query does not fire inside the desktop phone frame.
-->
<html lang="en" data-theme="prize-gold">
<head>
<meta charset="utf-8">

<title>Scan tray prototype</title>
<link rel="stylesheet" href="../../../../../../web/src/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }

  h1 { font-size: var(--font-size-xl); margin: 0; } h2 { font-size: var(--font-size-lg); margin: 0; } h3 { font-size: var(--font-size-md); margin: 0; }
  p { margin: 0; }

  /* Stage and phone frame */
  #stage { min-height: 100vh; }
  #stage.framed { display: flex; justify-content: center; align-items: flex-start; padding: 24px 0 96px; background: #0a0909; }
  #stage.framed .app { width: 440px; height: 956px; flex: none; border: 1px solid var(--color-border-strong); border-radius: 24px; overflow: hidden; transform: translateZ(0); }
  .app { container: app / inline-size; position: relative; background: var(--color-bg); }
  .app.pg:not(.desk) { display: flex; flex-direction: column; }
  .app.pg.desk { min-height: 100vh; }
  .app.scanner.desk { max-width: 480px; margin: 0 auto; height: calc(100dvh - 56px); overflow: hidden; border-inline: 1px solid var(--color-border); }
  html.vp-phone #stage { min-height: 0; }
  html.vp-phone .app { height: calc(100dvh - 44px); overflow: hidden; }
  html.vp-phone.nobar .app { height: 100dvh; }

  /* Prototype chrome */
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 900; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; max-width: calc(100vw - 24px); padding: 6px 10px; border-radius: 18px; background: #5b2bd6; color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.45); font-size: 12px; }
  #bar button, #bar select { height: 28px; max-width: 220px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); background: #4a20b0; color: #fff; font-size: 12px; }
  #bar button { background: transparent; }
  #bar button[aria-pressed="true"] { background: #fff; color: #5b2bd6; font-weight: 700; }
  #bar .t { opacity: .8; padding: 0 4px; } #bar label { display: inline-flex; gap: 4px; align-items: center; }
  html.vp-phone #bar { position: static; transform: none; width: 100%; max-width: none; height: 44px; border-radius: 0; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; box-shadow: none; padding: 0 10px; font-size: 16px; }
  html.vp-phone #bar > *, html.vp-phone #bar label > * { flex: none; }
  html.vp-phone #bar button, html.vp-phone #bar select { height: 32px; font-size: 16px; }
  html.nobar #bar { display: none; }
  #ptab { display: none; position: fixed; z-index: 900; top: calc(env(safe-area-inset-top) + 4px); left: 50%; transform: translateX(-50%); width: 28px; height: 28px; border-radius: 999px; border: 0; background: #5b2bd6; color: #fff; font-weight: 700; font-size: 14px; padding: 0; }
  html.nobar #ptab { display: block; }
  #pnote { position: fixed; z-index: 950; left: 50%; top: 52px; transform: translateX(-50%); max-width: 92vw; padding: 4px 10px; border-radius: 8px; background: #5b2bd6; color: #fff; font-size: 12px; pointer-events: none; text-align: center; }
  #pnote[hidden] { display: none; }
  .proto-note { display: inline-block; margin: 6px 0 0; padding: 0 6px; border: 1px dashed var(--color-control-outline); border-radius: 4px; font-size: var(--font-size-2xs); color: var(--color-text-subtle); vertical-align: middle; }

  /* Controls */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--size-control); padding: 0 12px; border-radius: var(--radius-control); border: 1px solid var(--color-control-outline); background: var(--color-surface-raised); font-size: var(--font-size-control); white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--color-accent-border); }
  .btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); font-weight: 600; }
  .btn.primary[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .btn.quiet { background: transparent; border-color: transparent; color: var(--color-text-muted); }
  .btn.danger { background: var(--color-danger-fill); border-color: var(--color-danger-border); color: var(--color-danger); }
  .btn:disabled { opacity: .45; }
  .btn.wide { width: 100%; }
  .pill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: var(--radius-round); border: 1px solid var(--color-border-strong); font-size: var(--font-size-xs); color: var(--color-text-muted); white-space: nowrap; vertical-align: middle; }
  .pill.warn { border-color: var(--color-warning); color: var(--color-warning); }
  .input, select.input { height: var(--size-control); width: 100%; padding: 0 10px; border-radius: var(--radius-control); border: 1px solid var(--color-control-outline); background: var(--color-surface); font-size: var(--font-size-control); min-width: 0; }
  .ib { width: 44px; height: 44px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: var(--radius-round); background: transparent; color: var(--color-text); }
  .ib.av > span { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--color-surface-selected); color: var(--color-accent-strong); font-weight: 700; font-size: var(--font-size-sm); }
  .lbl { font-size: var(--font-size-xs); color: var(--color-text-subtle); text-transform: uppercase; letter-spacing: 1px; }
  .meta { font-size: var(--font-size-sm); color: var(--color-text-muted); }
  .panel { border: 1px solid var(--color-border); border-radius: var(--radius-panel); background: var(--color-surface); }
  .pad { padding: 12px 14px; } .stack { display: grid; gap: 10px; } .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .note { padding: 10px 12px; border: 1px solid var(--color-warning); border-radius: var(--radius-panel); font-size: var(--font-size-control); display: grid; gap: 6px; justify-items: start; }
  .art { width: 36px; aspect-ratio: var(--tile-aspect); border-radius: 4px; border: 1px solid var(--color-border); flex: none; background: linear-gradient(160deg, var(--color-art-start), var(--color-art-end)); }

  /* Chips: 44 px tap box, 30 px face */
  .chips { display: flex; flex-wrap: wrap; gap: 0 6px; }

  .chip .face { display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 0 12px; border-radius: var(--radius-round); border: 1px solid var(--color-border-strong); font-size: var(--font-size-sm); color: var(--color-text-muted); line-height: 1.2; text-align: center; transition: background var(--motion-duration); }
  .chip[aria-pressed="true"] .face { border-color: var(--color-accent-border); background: var(--color-accent-fill); color: var(--color-accent-strong); }
  .chip:disabled .face { opacity: .55; }

  /* Page chrome (Collection, Import, Can't start) */
  .hdr { position: sticky; top: 0; z-index: 10; height: var(--layout-header-height); display: flex; align-items: center; gap: 24px; padding: 0 24px; border-bottom: 1px solid var(--color-border); background: var(--color-bg); }
  .word { font-size: var(--font-size-sm); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; } .word b { color: var(--color-accent); margin-right: 8px; }
  .tabs { display: flex; gap: 4px; } .tab { height: 32px; padding: 0 12px; display: inline-grid; place-items: center; border-radius: var(--radius-control); color: var(--color-text-muted); font-size: var(--font-size-control); }
  .tab[aria-current="page"] { background: var(--color-surface-selected); color: var(--color-accent-strong); font-weight: 600; }
  .phdr { flex: none; display: flex; align-items: center; justify-content: space-between; height: calc(56px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 6px 0 var(--layout-gutter); border-bottom: 1px solid var(--color-border); }
  .hacts { display: flex; }
  .tabbar { flex: none; display: flex; height: calc(var(--layout-tabbar-height) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--color-border); background: var(--color-bg); }
  .tabbar button { flex: 1; min-height: 44px; min-width: 0; border: 0; background: transparent; color: var(--color-text-muted); font-size: var(--font-size-sm); }
  .tabbar button[aria-current="page"] { color: var(--color-accent-strong); font-weight: 600; }
  .page { max-width: 1240px; margin: 0 auto; padding: 24px var(--layout-gutter) 140px; }
  .pgm { flex: 1; min-height: 0; overflow-y: auto; padding: 16px var(--layout-gutter) 24px; }
  .pagehead { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; } .pagehead .grow { flex: 1; min-width: 200px; }
  .lede { margin-top: 4px; color: var(--color-text-muted); font-size: var(--font-size-control); }
  .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin: 12px 0; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile-small), 1fr)); gap: var(--tile-gap-row) var(--tile-gap-column); }
  .tile { aspect-ratio: var(--tile-aspect); border-radius: var(--radius-card); background: linear-gradient(160deg, var(--color-art-start), var(--color-art-end)); border: 1px solid var(--color-border); position: relative; }
  .tile span { position: absolute; right: 6px; bottom: 6px; font-size: var(--font-size-xs); background: var(--color-bg); border-radius: var(--radius-round); padding: 0 6px; }
  .ws { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
  .side-loc { display: grid; gap: 2px; font-size: var(--font-size-control); } .side-loc div { padding: 6px 10px; border-radius: var(--radius-control); color: var(--color-text-muted); }
  .side-loc div.on { background: var(--color-surface-selected); color: var(--color-accent-strong); font-weight: 600; } .side-loc div.kid { padding-left: 24px; }
  .imp-grid { margin-top: 20px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .imp-grid.one { grid-template-columns: minmax(0, 560px); }
  .seg { display: inline-flex; max-width: 100%; border: 1px solid var(--color-control-outline); border-radius: var(--radius-control); overflow: hidden; }
  .seg button { height: calc(var(--size-control) - 2px); padding: 0 12px; border: 0; background: transparent; font-size: var(--font-size-control); color: var(--color-text-muted); }
  .seg button[aria-pressed="true"] { background: var(--color-surface-selected); color: var(--color-accent-strong); font-weight: 600; }
  .blk { max-width: 560px; margin: 16px 0; display: grid; gap: 12px; justify-items: start; padding: 16px; }
  details > summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--color-text-muted); font-size: var(--font-size-control); }
  details p { margin: 0 0 8px; font-size: var(--font-size-control); color: var(--color-text-muted); }
  .toast { position: absolute; left: 50%; bottom: calc(var(--layout-tabbar-height) + env(safe-area-inset-bottom) + 12px); transform: translateX(-50%); max-width: 92%; display: flex; gap: 14px; align-items: center; padding: 10px 14px; border-radius: var(--radius-panel); background: var(--color-surface-raised); border: 1px solid var(--color-border-strong); box-shadow: 0 8px 24px var(--color-shadow-strong); font-size: var(--font-size-control); z-index: 30; }
  .app.desk .toast { position: fixed; bottom: 76px; }

  /* Scanner */
  .scn { position: absolute; inset: 0; overflow: hidden; background: #26231f; }
  .stop { position: absolute; z-index: 8; left: 0; right: 0; top: 0; height: calc(56px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 6px 0; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
  .stop .ib { pointer-events: auto; background: color-mix(in srgb, #000 45%, transparent); }
  .camarea { position: absolute; left: 0; right: 0; top: calc(56px + env(safe-area-inset-top)); bottom: calc(232px + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: center; }
  .hintp { position: absolute; z-index: 2; top: 8px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 92%; padding: 6px 12px; border-radius: var(--radius-round); background: color-mix(in srgb, var(--color-bg) 82%, transparent); border: 1px solid var(--color-border-strong); font-size: var(--font-size-control); text-align: center; }
  .guide { position: relative; height: min(80%, calc(86cqw * 88 / 63)); aspect-ratio: 63 / 88; border: 2px solid color-mix(in srgb, var(--color-text) 80%, transparent); border-radius: 10px; transition: border-color var(--motion-duration) var(--motion-ease); }
  .guide::after { content: ""; position: absolute; z-index: 2; inset: 0; border-radius: 8px; background: var(--color-accent-wash); opacity: 0; transition: opacity var(--motion-duration) var(--motion-ease); pointer-events: none; }
  .guide.flash { border-color: var(--color-accent); } .guide.flash::after { opacity: 1; }
  .pcard { position: absolute; z-index: 1; left: 4%; top: 4%; width: 92%; height: 92%; border-radius: 6px; transform: rotate(-2deg); overflow: hidden; }
  .pcard i { position: absolute; left: 0; right: 0; bottom: 0; height: 33%; background: rgba(255,255,255,.2); }
  .pcard small { position: absolute; right: 6px; bottom: 5px; font-size: 10px; color: #1a1816; }
  .pcard b { position: absolute; left: 8px; right: 8px; top: 10px; font-size: var(--font-size-sm); }
  .shrow { position: absolute; z-index: 4; left: 0; right: 0; bottom: calc(136px + env(safe-area-inset-bottom)); height: 96px; display: grid; place-items: center; }
  .shutter { width: 72px; height: 72px; padding: 0; position: relative; border-radius: 50%; border: 4px solid var(--color-text); background: transparent; }
  .shutter::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--color-text); }
  .rdy { display: grid; gap: 14px; justify-items: center; text-align: center; }
  .rdy .guide { height: min(46%, calc(60cqw * 88 / 63)); }
  .camarea.rd { flex-direction: column; gap: 18px; }
  .pbar { width: min(240px, 70cqw); height: 6px; border-radius: 99px; background: var(--color-surface-raised); } .pbar > i { display: block; height: 100%; border-radius: inherit; background: var(--color-accent); }
  .strip { position: absolute; z-index: 6; left: 0; right: 0; top: 0; bottom: 85%; border: 0; border-radius: 0; padding: calc(56px + env(safe-area-inset-top)) 0 0; display: grid; place-items: center; background: var(--color-scrim); color: var(--color-text); font-size: var(--font-size-control); }

  .sheet { position: absolute; z-index: 10; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; background: var(--color-surface); border-top: 1px solid var(--color-border-strong); border-radius: var(--radius-dialog) var(--radius-dialog) 0 0; box-shadow: 0 -8px 24px var(--color-shadow-strong); padding-bottom: env(safe-area-inset-bottom); }
  .sheet.peek { height: calc(136px + env(safe-area-inset-bottom)); }
  .sheet.open { height: 85%; animation: up var(--motion-duration) var(--motion-ease); }
  @keyframes up { from { transform: translateY(24px); } to { transform: none; } }
  .grab { flex: none; width: 36px; height: 4px; margin: 8px auto 4px; border-radius: 4px; background: var(--color-border-strong); }
  .sh-h { flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; min-height: 48px; touch-action: none; }
  .sh-h h2 { font-size: var(--font-size-lg); } .sh-h .tot { color: var(--color-text-muted); font-size: var(--font-size-control); margin-right: auto; }
  .crow { margin: 0 12px; min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 6px 8px; text-align: left; border: 1px solid var(--color-border); border-radius: var(--radius-control); background: var(--color-surface-raised); }
  .crow .art { width: 28px; } .crow .tx { flex: 1; min-width: 0; } .crow .tx > * { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crow.rise { animation: rise var(--motion-duration) var(--motion-ease); }
  @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .emptyl { padding: 8px 14px; color: var(--color-text-muted); font-size: var(--font-size-control); }
  .destbtn { flex: none; margin: 0 12px 4px; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border-radius: var(--radius-control); border: 1px solid var(--color-control-outline); background: var(--color-surface-raised); font-size: var(--font-size-control); }
  .destbtn .v { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; min-width: 0; text-align: right; }
  .sh-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 8px; display: grid; gap: 10px; align-content: start; }
  .sh-f { flex: none; padding: 10px 12px 12px; border-top: 1px solid var(--color-border); display: grid; gap: 6px; background: var(--color-surface); }
  .fl { font-size: var(--font-size-control); color: var(--color-text-muted); } .fl.warn { color: var(--color-warning); }
  .grp-h { display: flex; align-items: center; gap: 8px; padding-top: 6px; font-size: var(--font-size-md); font-weight: 600; } .grp-h .num { color: var(--color-warning); }
  .sep { border-top: 1px solid var(--color-border-strong); margin: 4px 0; }
  .trow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 8px 10px; padding: 10px 0; border-bottom: 1px solid var(--color-border); align-items: start; }
  .trow.needs { background: color-mix(in srgb, var(--color-warning) 6%, transparent); }
  .trow .mid { min-width: 0; display: grid; gap: 2px; justify-items: start; } .trow .nm { font-weight: 700; overflow-wrap: anywhere; } .trow .mid > * { max-width: 100%; }
  .step { display: flex; align-items: center; } .step .num { min-width: 28px; text-align: center; font-weight: 700; }
  .sbtn { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border-radius: var(--radius-control); border: 1px solid var(--color-control-outline); background: var(--color-surface-raised); }
  .sbtn:disabled { opacity: .4; }
  .resolver { width: 100%; margin-top: 4px; padding: 10px; display: grid; gap: 8px; border-radius: var(--radius-control); border: 1px solid var(--color-accent-outline); background: var(--color-surface-raised); }
  .cand { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; align-items: center; width: 100%; min-height: 44px; padding: 6px 8px; text-align: left; border: 1px solid var(--color-border); border-radius: var(--radius-control); background: var(--color-surface); font-size: var(--font-size-control); }
  .cand .art { width: 24px; } .cand[aria-pressed="true"] { border-color: var(--color-accent-border); background: var(--color-surface-selected); }
  .pickf { padding: 0 8px; } .warnt { color: var(--color-warning); }

  .scrim { position: absolute; inset: 0; z-index: 20; background: var(--color-scrim); }
  .dlg { position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; max-height: 85%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); background: var(--color-surface); border-top: 1px solid var(--color-border-strong); border-radius: var(--radius-dialog) var(--radius-dialog) 0 0; }
  .dlg.tall { height: 85%; } .dlg .btns { display: grid; gap: 8px; }
  .app.desk .dlg { left: 50%; right: auto; top: 50%; bottom: auto; width: min(480px, 92%); transform: translate(-50%, -50%); border: 1px solid var(--color-border-strong); border-radius: var(--radius-dialog); }
  .radio { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 12px; text-align: left; border: 1px solid var(--color-border); border-radius: var(--radius-control); background: var(--color-surface-raised); }
  .radio::before { content: ""; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--color-control-outline); }
  .radio[aria-checked="true"] { border-color: var(--color-accent-border); background: var(--color-surface-selected); }
  .radio[aria-checked="true"]::before { border-color: var(--color-accent); background: radial-gradient(var(--color-accent) 0 45%, transparent 50%); }
  .radios { display: grid; gap: 8px; }

  @container app (max-width: 760px) {
    .btn { height: var(--size-control-phone); }
    .input, select.input { height: var(--size-control-phone); font-size: 16px; }
    .seg button { height: 44px; }
    .imp-grid { grid-template-columns: 1fr; } .ws { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet.open, .crow.rise { animation: none; } }
</style>
</head>
<body>
<div id="bar" data-proto></div>
<button id="ptab" data-proto data-a="showbar" aria-label="Show prototype bar">P</button>
<div id="pnote" data-proto hidden></div>
<div id="stage"><div class="app" id="app"></div></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script>
// ---------- Icons (Lucide, ISC) ----------

const FIXTURES = {}; const FILL = {};
function seedFixtures() { Object.keys(FIXTURES).forEach(k => delete FIXTURES[k]); Object.assign(FIXTURES, mkFixtures()); }
const P = k => FIXTURES[k] || (/^fill-\d+$/.test(k) ? (FILL[k] = FILL[k] || mkFill(k)) : null);
function mkFill(k) { const n = +k.slice(5); return { key: k, name: FILLN[(n - 1) % 6], set: 'Practice Set', code: 'PS', num: String(n).padStart(3, '0'), art: '#6b6259', editions: E(k, ['Normal']), cands: [k], missing: false }; }
const activeEds = p => p.editions.filter(e => e.active);
const edOf = (p, id) => p.editions.find(e => e.id === id);
const cardText = p => `${p.name} · ${p.set} ${p.num}`;
const artOf = p => p && p.art ? `background:${p.art}` : '';

/* The finish rule (owner decision, amended 2026-10-22). Over the Printing's ACTIVE Editions, in the catalog's
   descriptor_key order (the array order here, by fiat), pick the first that applies:
   1. no active Edition: null (the Printing cannot be added);
   2. exactly one active Edition: that one;
   3. an active "Unspecified Variant": that one;
   4. an active "Normal": that one (the first, when several match);
   5. otherwise the first active Edition. */
function defaultEdition(editions) {
  const a = editions.filter(e => e.active);
  if (!a.length) return null;
  if (a.length === 1) return a[0];
  return a.find(e => e.label === 'Unspecified Variant') || a.find(e => e.label === 'Normal') || a[0];
}

// ---------- Copy ----------
const H_UNRES = "Couldn't add this card. Tap the shutter to search.";
const H_OFF = "Can't reach PrizeCheck. Check your connection and scan again.";
const H_MAX = "That's the most copies of one card in a tray.";
const H_DEF = ''; // owner (P3): no standing guide note
const GATE = { soft: 'Hold steady', dark: 'More light', glare: 'Tilt to avoid glare' };
const LEAVES = ['Unsorted', 'Binders / Binder 1', 'Binders / Binder 2', 'Trade box'];

// ---------- States and params ----------
const DEF = { screen: 'collection', why: 'denied', tray: 'some', sheet: 'peek', gate: 'ok', hint: 'none', net: 'on', stale: '0', staleview: 'a', save: 'none', dialog: 'none', search: '0', sound: '0', lockdemo: '0', hold: '0', frame: '', bar: '1' };
const STATES = [
  ['Entry', 'Collection: Scan cards', 'screen=collection'],
  ['Entry', 'Collection Import: Camera', 'screen=import'],
  ['Entry', 'Phone header shortcut', 'screen=collection&frame=phone'],
  ['Start', "Can't start: camera blocked", 'screen=blocked&why=denied'],
  ['Start', "Can't start: no camera", 'screen=blocked&why=nocamera'],
  ['Start', "Can't start: scanner not ready", 'screen=blocked&why=noindex'],
  ['Start', 'Getting ready (held)', 'screen=ready&hold=1&tray=empty'],
  ['Start', 'Getting ready (animated)', 'screen=ready&tray=empty'],
  ['Camera', 'Camera, empty tray', 'screen=scan&tray=empty'],

  ['Camera', 'Glare', 'screen=scan&gate=glare'],

  ['Camera', 'Lock sound on', 'screen=scan&sound=1'],
  ['Tray', 'Tray open', 'screen=scan&sheet=open'],
  ['Tray', 'Miss: search', 'screen=scan&search=1'],
  ['Tray', "Couldn't add this card", 'screen=scan&hint=unresolved'],
  ['Tray', 'Destination picker', 'screen=scan&sheet=open&dialog=dest'],
  ['Tray', 'Full tray', 'screen=scan&tray=full&dialog=full'],
  ['Tray', 'Clear tray', 'screen=scan&sheet=open&dialog=clear'],
  ['Problems', 'Offline tray', 'screen=scan&sheet=open&net=off'],
  ['Problems', 'Offline lock', 'screen=scan&net=off&hint=offline'],
  ['Problems', 'Stale rows, in place (A)', 'screen=scan&sheet=open&stale=1&staleview=a'],
  ['Problems', 'Stale rows, grouped (B)', 'screen=scan&sheet=open&stale=1&staleview=b'],
  ['Problems', 'Finishes changed at save', 'screen=scan&sheet=open&save=editions'],

  ['Save', 'After Confirm', 'screen=done']
];
const norm = q => Object.assign({}, DEF, Object.fromEntries(new URLSearchParams(q)));
const matchIdx = p => STATES.findIndex(s => { const n = norm(s[2]); return Object.keys(DEF).filter(k => k !== 'frame' && k !== 'bar').every(k => n[k] === p[k]); });

// ---------- State ----------
const S = {}; let T = {}; let AC = null;
const clearTimers = () => { Object.values(T).forEach(t => { clearTimeout(t); clearInterval(t); }); T = {}; };
const total = () => S.rows.reduce((n, r) => n + r.count, 0);
const distinct = () => new Set(S.rows.map(r => r.eid));
const needsN = () => S.rows.filter(r => r.needs).length;
const frozen = () => S.save === 'pending' || S.save === 'retry';
const paused = () => S.sheet === 'open' || !!S.search || S.dialog !== 'none';
const lastSeg = p => p.split(' / ').pop();
const rowCands = pid => P(pid).cands.filter(k => P(k) && !P(k).missing && defaultEdition(P(k).editions)).slice(0, 3);
const mkRow = (id, pid, label, count, needs = false) => ({ id, pid, eid: `${pid}/${label}`, count, cands: rowCands(pid), needs });

function buildTray(p) {
  if (p.tray === 'empty') return [];
  const R = mkRow;
  const rows = [R('r1', 'ralts', 'Normal', 3), R('r2', 'candySVI', 'Normal', 4), R('r3', 'snorlax', 'Unspecified Variant', 1), R('r4', 'ralts', 'Reverse Holo', 1), R('r5', 'iono', 'Holo', 1), R('r6', 'charizard', 'Holo', 1), R('r7', 'energy', 'Normal', 10)];
  if (p.stale === '1') { rows.splice(5, 0, R('s2', 'zeraora', 'Holo', 1, true)); rows.splice(2, 0, R('s1', 'dreepy', 'Reverse Holo', 2, true)); }
  if (p.tray === 'full') for (let n = 1; n <= 193; n++) rows.push(R(`f${n}`, `fill-${n}`, 'Normal', 1));
  return rows;
}
function catalogChange() {   // the server's EDITIONS_CHANGED answer, as the client sees it
  const p = FIXTURES.ralts;
  if (edOf(p, 'ralts/Reverse Holo').active) {
    edOf(p, 'ralts/Reverse Holo').active = false;
    p.editions.push({ id: 'ralts/Reverse Holo, Poké Ball', label: 'Reverse Holo, Poké Ball', active: true }, { id: 'ralts/Reverse Holo, Master Ball', label: 'Reverse Holo, Master Ball', active: true });
  }
  S.rows.forEach(r => { if (!edOf(P(r.pid), r.eid).active) r.needs = true; });
  S.msg = 'editions'; S.group = new Set(S.rows.filter(r => r.needs).map(r => r.id));
}

function init(p, idx) {
  clearTimers(); const dl = !!S.downloaded;
  if (!['phone', 'off'].includes(p.frame)) p.frame = '';
  Object.keys(S).forEach(k => delete S[k]);
  seedFixtures(); $('#pnote').hidden = true;
  Object.assign(S, { p, screen: p.screen, rows: buildTray(p), sheet: p.sheet === 'open' ? 'open' : 'peek', net: p.net, staleview: p.staleview, save: ['pending', 'retry', 'old'].includes(p.save) ? p.save : 'none', msg: null, dialog: p.dialog, search: p.search === '1' ? { q: '', pick: null } : null, sound: p.sound === '1', dest: 'Unsorted', leaves: [...LEAVES], cam: { placed: null, locked: false, gate: p.gate }, hint: p.hint === 'unresolved' ? { text: H_UNRES, sticky: true } : p.hint === 'offline' ? { text: H_OFF, sticky: true } : null, res: null, nextSave: 'ok', simCard: 'ralts', downloaded: dl, seq: 100, lastId: null, group: new Set(), src: 'camera', toast: null, lastCount: 21, progress: 0, opener: null, refocus: null, rise: false, hasStale: p.stale === '1' || p.save === 'editions' });

  if (p.save === 'editions') catalogChange();
  if (p.dialog === 'dest') S.opener = 'dest'; if (p.dialog === 'clear') S.opener = 'clearbtn';
  if (p.save === 'destination') { S.leaves = LEAVES.filter(l => l !== 'Binders / Binder 2'); S.dialog = 'dest'; S.msg = 'destination'; }
  S.group = new Set(S.rows.filter(r => r.needs).map(r => r.id));
  const z = S.rows.find(r => r.needs && P(r.pid).missing); if (z) S.res = { id: z.id, q: '', pick: null };
  if (p.screen === 'done') S.toast = 'Added 21 cards to Unsorted.';
  S.stateIdx = idx !== undefined ? idx : matchIdx(p);
  if (p.screen === 'ready') startReady();
  if (p.lockdemo === '1' && p.screen === 'scan') { S.cam.placed = 'ralts'; T.ld = setTimeout(() => lock('ralts', 'auto'), 400); }
  render();
}
function load(q, idx) { const p = norm(q), q0 = new URLSearchParams(q); if (!q0.has('frame')) p.frame = (S.p && S.p.frame) || ''; if (!q0.has('bar')) p.bar = (S.p && S.p.bar) || '1'; init(p, idx); }
function setURL() {
  const u = new URLSearchParams(), put = (k, v) => { if (v !== undefined && v !== DEF[k]) u.set(k, v); };
  u.set('screen', S.screen);
  if (S.screen === 'blocked') put('why', S.p.why);
  put('tray', S.p.tray); put('sheet', S.sheet); put('gate', S.cam.gate);
  put('hint', S.hint && S.hint.sticky ? (S.hint.text === H_OFF ? 'offline' : 'unresolved') : 'none');
  put('net', S.net); put('stale', S.p.stale); put('staleview', S.staleview);
  put('save', S.save !== 'none' ? S.save : (S.msg || 'none'));
  put('dialog', S.dialog); put('search', S.search ? '1' : '0'); put('sound', S.sound ? '1' : '0');
  put('lockdemo', S.p.lockdemo); put('hold', S.p.hold); put('frame', S.p.frame); put('bar', S.p.bar);

}

// ---------- Prototype helpers ----------
function note(t) { const n = $('#pnote'); n.textContent = t; n.hidden = false; clearTimeout(T.note); T.note = setTimeout(() => { n.hidden = true; }, 2000); }
function unlock() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; } }
function beep() { if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.06); }
function hint(text, ms) { S.hint = { text, sticky: false }; clearTimeout(T.hint); T.hint = setTimeout(() => { S.hint = null; render(); }, ms); }
function announce(t) { const l = $('#live'); l.textContent = ''; setTimeout(() => { l.textContent = t; }, 30); }
function startReady() {
  clearInterval(T.rdy); S.progress = S.p.hold === '1' ? 40 : 0; if (S.p.hold === '1') return;
  T.rdy = setInterval(() => {
    S.progress += 100 / 30;
    if (S.progress >= 100) { clearInterval(T.rdy); S.downloaded = true; S.screen = 'scan'; render(); return; }
    const b = $('#pb'); if (b) { b.setAttribute('aria-valuenow', Math.round(S.progress)); b.firstElementChild.style.width = S.progress + '%'; }
  }, 100);
}
function startScan() { S.sheet = 'peek'; if (S.downloaded) S.screen = 'scan'; else { S.screen = 'ready'; startReady(); } }

// ---------- Lock logic ----------
function cue(row, via, text) {
  S.lastId = row.id; S.rise = true; clearTimeout(T.rise); T.rise = setTimeout(() => { S.rise = false; }, 300);
  announce(text);
  if (via !== 'search') { if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(30); if (S.sound) beep(); }
  render(); flash();
}
function flash() { const g = $('.guide'); if (!g) return; g.classList.add('flash'); clearTimeout(T.flash); T.flash = setTimeout(() => { const x = $('.guide'); if (x) x.classList.remove('flash'); }, 470); }
function lock(key, via) {
  if (frozen() || paused()) return;
  if (S.net === 'off') { hint(H_OFF, 4000); render(); return; }
  const p0 = P(key);
  if (!p0) { if (via === 'auto') note('Not recognized, so no lock'); else openSearch(); return; }
  const cand = p0.cands.map(P).find(c => c && !c.missing && defaultEdition(c.editions));
  if (!cand) { if (via === 'auto') { hint(H_UNRES, 4000); render(); } else openSearch(); return; }
  const same = S.rows.find(r => r.pid === cand.key);   // rows are newest first, so this is the newest row of the Printing
  if (same) {
    if (same.count >= 999) { hint(H_MAX, 4000); render(); return; }
    same.count++; S.cam.locked = true;
    cue(same, via, `${cand.name}: ${S.rows.filter(r => r.pid === cand.key).reduce((n, r) => n + r.count, 0)} in the tray.`); return;
  }
  if (distinct().size >= 200) { S.cam.locked = true; S.dialog = 'full'; render(); return; }
  const ed = defaultEdition(cand.editions);
  const row = { id: 'r' + (++S.seq), pid: cand.key, eid: ed.id, count: 1, cands: [cand.key, ...rowCands(key).filter(k => k !== cand.key)].slice(0, 3), needs: false };
  S.rows.unshift(row); S.cam.locked = true;
  cue(row, via, `Added ${cardText(cand)}, ${ed.label}.`);
}
function openSearch() { S.search = { q: '', pick: null }; render(); }
function addFromSearch(p, ed) {
  if (!distinct().has(ed.id) && distinct().size >= 200) { S.search = null; S.dialog = 'full'; render(); return; }
  const row = { id: 'r' + (++S.seq), pid: p.key, eid: ed.id, count: 1, cands: rowCands(p.key), needs: false };
  S.rows.unshift(row); S.search = null; S.refocus = 'shutter';
  cue(row, 'search', `Added ${cardText(p)}, ${ed.label}.`);
}
function setEdition(id, eid) {
  const r = S.rows.find(x => x.id === id); if (!r || (r.eid === eid && !r.needs)) return;
  const others = new Set(S.rows.filter(x => x !== r).map(x => x.eid));
  if (!others.has(eid) && others.size >= 200) { S.dialog = 'full'; render(); return; }
  r.eid = eid; r.needs = false; render();
}
function applyPrinting(id, p, ed) {
  const r = S.rows.find(x => x.id === id); if (!r) return;
  const others = new Set(S.rows.filter(x => x !== r).map(x => x.eid));
  if (!others.has(ed.id) && others.size >= 200) { S.dialog = 'full'; render(); return; }
  r.pid = p.key; r.eid = ed.id; r.needs = false; S.res = null; render();
}

// ---------- Save ----------
function runSave() {
  const m = S.nextSave; S.save = 'pending'; S.msg = null; render();
  const later = (fn, ms) => { T.save = setTimeout(() => { fn(); render(); }, ms); };
  if (m === 'ok') later(() => { S.lastCount = total(); S.toast = `Added ${cnt(S.lastCount)} to ${S.dest}.`; S.rows = []; S.save = 'none'; S.screen = 'done'; S.sheet = 'peek'; S.res = null; }, 600);
  else if (m === 'editions') later(() => { S.save = 'none'; S.nextSave = 'ok'; catalogChange(); }, 600);
  else if (m === 'location') later(() => { S.save = 'none'; S.nextSave = 'ok'; if (S.dest !== 'Unsorted') S.leaves = S.leaves.filter(l => l !== S.dest); S.dest = 'Unsorted'; S.msg = 'destination'; S.dialog = 'dest'; S.opener = null; }, 600);
  else if (m === 'none') later(() => { S.save = 'retry'; }, 1500);
}
