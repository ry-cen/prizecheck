<!doctype html>
<!--
  PROTOTYPE, throw me away. Collection import review for "Prototype the collection import review" (ry-cen/prizecheck#223).
  One layout (the owner trimmed the map to one), built on decklist import's approved review: one list, filter chips, a side column.
  Screens: Collection → Import → Review → back in the Collection. Mock data in memory only; nothing is saved.
  Colours and spacing come from web/src/tokens.css.
-->
<html lang="en" data-theme="prize-gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection import prototype</title>
<link rel="stylesheet" href="../../../../../../web/src/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--color-bg); color: var(--color-text); font: var(--font-size-md)/var(--line-height) var(--font-sans); }
  button, input, textarea, select { font: inherit; color: inherit; }
  .num { font-variant-numeric: var(--numeric); }
  .muted { color: var(--color-text-muted); }
  .subtle { color: var(--color-text-subtle); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--font-size-xs); }
  .warn { color: var(--color-warning); }
  :focus-visible { outline: var(--focus-width) solid var(--color-focus); outline-offset: var(--focus-offset); }

  #stage { min-height: 100vh; }
  #stage.framed { display: flex; justify-content: center; padding: 24px 0 96px; background: #0a0909; }
  #stage.framed .app { width: 375px; height: 812px; overflow: auto; border: 1px solid var(--color-border-strong); border-radius: 24px; transform: translateZ(0); }
  .app { container: app / inline-size; background: var(--color-bg); min-height: 100%; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--size-control); padding: 0 12px; border-radius: var(--radius-control); border: 1px solid var(--color-control-outline); background: var(--color-surface-raised); font-size: var(--font-size-control); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--color-accent-border); }
  .btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); font-weight: 600; }
  .btn.primary[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .btn.quiet { background: transparent; border-color: transparent; color: var(--color-text-muted); }
  .btn.small { height: var(--size-quick); padding: 0 10px; font-size: var(--font-size-sm); }
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: var(--radius-round); border: 1px solid var(--color-border-strong); font-size: var(--font-size-xs); color: var(--color-text-muted); white-space: nowrap; }
  .pill.gold { border-color: var(--color-accent-border); color: var(--color-accent-strong); background: var(--color-accent-fill); }
  .pill.warn { border-color: var(--color-warning); color: var(--color-warning); }
  .pill.danger { border-color: var(--color-danger-border); color: var(--color-danger); background: var(--color-danger-fill); }
  .chip { height: var(--size-chip); padding: 0 10px; border-radius: var(--radius-round); border: 1px solid var(--color-border-strong); background: transparent; font-size: var(--font-size-sm); color: var(--color-text-muted); cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { border-color: var(--color-accent-border); background: var(--color-accent-fill); color: var(--color-accent-strong); }
  .input, select.input { height: var(--size-control); padding: 0 10px; border-radius: var(--radius-control); border: 1px solid var(--color-control-outline); background: var(--color-surface); font-size: var(--font-size-control); min-width: 0; }
  textarea.input { height: 220px; width: 100%; padding: 10px; resize: vertical; line-height: 1.45; font-family: ui-monospace, Menlo, monospace; font-size: var(--font-size-sm); }
  .proto-note { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px dashed var(--color-control-outline); border-radius: 4px; font-size: var(--font-size-2xs); color: var(--color-text-subtle); white-space: nowrap; vertical-align: middle; }
  .link { color: var(--color-accent); cursor: pointer; background: none; border: 0; padding: 0; font-size: inherit; }

  .hdr { position: sticky; top: 0; z-index: 10; height: var(--layout-header-height); display: flex; align-items: center; gap: 24px; padding: 0 24px; border-bottom: 1px solid var(--color-border); background: var(--color-bg); }
  .word { font-size: var(--font-size-sm); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .word b { color: var(--color-accent); margin-right: 8px; }
  .tabs { display: flex; gap: 4px; }
  .tab { height: 32px; padding: 0 12px; border-radius: var(--radius-control); border: 0; background: transparent; color: var(--color-text-muted); font-size: var(--font-size-control); }
  .tab[aria-current="page"] { background: var(--color-surface-selected); color: var(--color-accent-strong); font-weight: 600; }
  .page { max-width: 1240px; margin: 0 auto; padding: 24px var(--layout-gutter) 140px; }
  h1 { font-size: var(--font-size-xl); margin: 0; } h2 { font-size: var(--font-size-lg); margin: 0; } h3 { font-size: var(--font-size-md); margin: 0; }
  .lede { margin: 4px 0 0; color: var(--color-text-muted); font-size: var(--font-size-control); }
  .pagehead { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .pagehead .grow { flex: 1; min-width: 200px; }
  .panel { border: 1px solid var(--color-border); border-radius: var(--radius-panel); background: var(--color-surface); }
  .panel-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--color-border); }
  .pad { padding: 12px 14px; }
  .stack { display: grid; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .lbl { font-size: var(--font-size-xs); color: var(--color-text-subtle); text-transform: uppercase; letter-spacing: 1px; }
  .art { width: 30px; aspect-ratio: var(--tile-aspect); border-radius: 4px; background: linear-gradient(160deg, var(--color-art-start), var(--color-art-end)); border: 1px solid var(--color-border); flex: none; }

  /* Workspace (start and finish) */
  .ws { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
  .side-loc { display: grid; gap: 2px; font-size: var(--font-size-control); }
  .side-loc div { padding: 6px 10px; border-radius: var(--radius-control); color: var(--color-text-muted); }
  .side-loc div.on { background: var(--color-surface-selected); color: var(--color-accent-strong); font-weight: 600; }
  .side-loc div.kid { padding-left: 24px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
  .tile { aspect-ratio: var(--tile-aspect); border-radius: var(--radius-card); background: linear-gradient(160deg, var(--color-art-start), var(--color-art-end)); border: 1px solid var(--color-border); position: relative; }
  .tile span { position: absolute; right: 6px; bottom: 6px; font-size: var(--font-size-xs); background: var(--color-bg); border-radius: var(--radius-round); padding: 0 6px; }
  .empty { padding: 48px 24px; text-align: center; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-panel); }
  .toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; padding: 10px 14px; border-radius: var(--radius-panel); background: var(--color-surface-raised); border: 1px solid var(--color-border-strong); box-shadow: 0 8px 24px var(--color-shadow-strong); font-size: var(--font-size-control); z-index: 30; }

  /* Import screen */
  .imp-grid { margin-top: 20px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .drop { display: grid; place-items: center; gap: 10px; height: 220px; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-panel); text-align: center; padding: 16px; }
  .seg { display: inline-flex; border: 1px solid var(--color-control-outline); border-radius: var(--radius-control); overflow: hidden; }
  .seg button { height: calc(var(--size-control) - 2px); padding: 0 12px; border: 0; background: transparent; font-size: var(--font-size-control); cursor: pointer; color: var(--color-text-muted); }
  .seg button[aria-pressed="true"] { background: var(--color-surface-selected); color: var(--color-accent-strong); font-weight: 600; }

  /* Review */
  .rv-grid { margin-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .rv-side { position: sticky; top: calc(var(--layout-header-height) + 16px); display: grid; gap: 12px; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 16px; padding: 12px 16px; border: 1px solid var(--color-border); border-radius: var(--radius-panel); background: var(--color-surface); }
  .stat .v { font-size: var(--font-size-lg); font-weight: 700; }
  .filter { display: flex; gap: 6px; flex-wrap: wrap; }
  .bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 14px; background: var(--color-accent-wash); border-bottom: 1px solid var(--color-accent-border); font-size: var(--font-size-control); }
  .ln { display: grid; grid-template-columns: 18px 30px minmax(0, 1fr) auto; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--color-border); align-items: start; }
  .ln.problem { background: color-mix(in srgb, var(--color-warning) 6%, transparent); }
  .ln.skipped { opacity: .55; } .ln.skipped .nm { text-decoration: line-through; }
  .ln input[type=checkbox] { margin-top: 8px; accent-color: var(--color-accent); }
  .nm { font-weight: 600; }
  .q { font-weight: 700; color: var(--color-accent-strong); margin-right: 6px; }
  .meta { font-size: var(--font-size-sm); color: var(--color-text-muted); }
  .resolver { grid-column: 3 / -1; margin-top: 4px; padding: 10px; border-radius: var(--radius-control); border: 1px solid var(--color-accent-outline); background: var(--color-surface-raised); display: grid; gap: 8px; }
  .cand { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--color-border); border-radius: var(--radius-control); background: var(--color-surface); cursor: pointer; text-align: left; font-size: var(--font-size-control); }
  .cand:hover { border-color: var(--color-accent-border); }
  .cand .art { width: 24px; }
  .more { padding: 10px 14px; text-align: center; }
  .grp { display: flex; gap: 8px; align-items: center; font-size: var(--font-size-control); }
  .grp input { accent-color: var(--color-accent); }
  .grp .n { margin-left: auto; color: var(--color-text-subtle); }
  .lo { display: flex; justify-content: space-between; font-size: var(--font-size-control); padding: 2px 0; }
  .savebar { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 16px; margin-top: 16px; border: 1px solid var(--color-border-strong); border-radius: var(--radius-panel); background: var(--color-surface-raised); box-shadow: 0 -6px 24px var(--color-shadow-strong); }
  .savebar .grow { flex: 1; min-width: 160px; font-size: var(--font-size-control); }
  .modal-bg { position: fixed; inset: 0; background: var(--color-scrim); display: grid; place-items: center; z-index: 40; }
  .modal { width: min(560px, 92vw); max-height: 80vh; overflow: auto; background: var(--color-surface); border: 1px solid var(--color-border-strong); border-radius: var(--radius-dialog); }

  @container app (max-width: 760px) {
    .hdr .tabs { display: none; }
    .ws, .imp-grid, .rv-grid { grid-template-columns: 1fr; }
    .ws > aside { display: none; }
    .rv-side { position: static; order: -1; }
    .btn { height: var(--size-control-phone); }
    .ln { grid-template-columns: 18px minmax(0, 1fr) auto; } .ln .art { display: none; }
    .resolver { grid-column: 2 / -1; }
  }

  /* Prototype switcher */
  .switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 999px; background: #5b2bd6; color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.45); font-size: 12px; }
  .switcher button { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; cursor: pointer; font-size: 12px; }
  .switcher button[aria-pressed="true"] { background: #fff; color: #5b2bd6; font-weight: 700; }
  .switcher .t { opacity: .8; padding: 0 4px; }
</style>
</head>
<body>
<div id="stage"><div class="app" id="app"></div></div>
<div id="modal"></div>
<div class="switcher" id="sw"></div>
<script>
// ---------- Mock data ----------
const NAMES = ['Pikachu','Charizard','Eevee','Gardevoir','Iono','Rare Candy','Snorlax','Lucario','Umbreon','Ultra Ball','Ralts','Kirlia','Bidoof','Bibarel','Arven','Boss\'s Orders','Dragapult','Drakloak','Dreepy','Miraidon','Greninja','Froakie','Mew','Mewtwo','Gengar','Haunter','Gastly','Sylveon','Espeon','Squirtle','Wartortle','Blastoise','Bulbasaur','Ivysaur','Venusaur','Zeraora','Adaman','Lugia','Rayquaza','Pidgeot'];
const SETS = [['Astral Radiance','ASR',189],['Paldea Evolved','PAL',193],['Obsidian Flames','OBF',197],['Scarlet & Violet','SVI',198],['Temporal Forces','TEF',162],['Stellar Crown','SCR',142],['Evolving Skies','EVS',203],['Silver Tempest','SIT',195],['Crown Zenith','CRZ',159],['Twilight Masquerade','TWM',167],['Surging Sparks','SSP',191],['Base Set','BS',102]];
const FINISHES = ['Normal','Holo','Reverse Holo'];
const GROUPS = [['Main',1050],['Binder 2',130],['Sold',64]];
function mkRows() {
  const rows = []; let i = 0;
  for (const [g, n] of GROUPS) for (let k = 0; k < n; k++, i++) {
    const name = NAMES[(i * 7) % NAMES.length], set = SETS[(i * 5) % SETS.length], num = 1 + (i * 13) % set[2];
    const qty = i % 9 === 0 ? 3 : i % 5 === 0 ? 2 : 1;
    let status = 'ok';
    if (i % 97 === 11) status = 'pick'; else if (i % 151 === 40) status = 'notfound'; else if (i % 211 === 77) status = 'cantread';
    else if (i % 37 === 1) status = 'name'; else if (i % 6 === 2) status = 'finish';
    const finish = status === 'finish' ? null : FINISHES[i % 3];
    const src = status === 'cantread' ? `${name},,${set[0]},??,Near Mint` : `${qty},${name},${set[0]},${String(num).padStart(3,'0')}/${set[2]},${status === 'finish' ? '' : finish},Near Mint`;
    rows.push({ id: i, group: g, name, set: set[0], code: set[1], num, qty, status, finish, src, held: i % 4 === 0 ? 1 + (i % 3) : 0, skipped: false, fixed: false, picked: null });
  }
  return rows;
}
const LEFT_OUT = [['On a watchlist', 9], ['Sealed products', 3], ['From other games', 12], ['Not in English', 40]];
const LEAVES = ['Unsorted', 'Binder 1', 'Binder 2', 'Trade box', 'Deck: Gardevoir ex'];

// ---------- State ----------
const qs = new URLSearchParams(location.search);
const S = { screen: qs.get('screen') || 'start', empty: qs.get('empty') === '1', frame: qs.get('frame') === 'phone',
  leaf: 'Unsorted', source: 'file', groups: { 'Main': true, 'Binder 2': true, 'Sold': true }, rows: mkRows(),
  filter: null, sel: new Set(), shown: 100, open: null, loaded: false, modal: null };
const NEEDS = r => ['pick', 'notfound', 'cantread'].includes(r.status) && !r.fixed && !r.skipped;
const incl = () => S.rows.filter(r => S.groups[r.group]);
function counts() {
  const rs = incl();
  const c = { all: rs.length, needs: 0, finish: 0, name: 0, skipped: 0, ready: 0, cards: 0, held: 0 };
  for (const r of rs) {
    if (r.skipped) { c.skipped++; continue; }
    if (NEEDS(r)) { c.needs++; continue; }
    if (r.status === 'finish' && !r.finish) c.finish++;
    if (r.status === 'name' && !r.fixed) c.name++;
    c.ready++; c.cards += r.qty; if (r.held) c.held++;
  }
  return c;
}
const fmt = n => n.toLocaleString('en-US');
function setURL() { const p = new URLSearchParams({ screen: S.screen }); if (S.empty) p.set('empty', '1'); if (S.frame) p.set('frame', 'phone'); history.replaceState(null, '', '?' + p); }
function go(screen) { S.screen = screen; if (screen === 'review' && S.filter === null) S.filter = counts().needs ? 'needs' : 'all'; setURL(); render(); window.scrollTo(0, 0); document.querySelector('.app').scrollTop = 0; }

// ---------- Views ----------
function shell(body) {
  return `<header class="hdr"><div class="word"><b>◆</b>PrizeCheck</div><nav class="tabs"><span class="tab" aria-current="page">Collection</span><span class="tab">Decks</span><span class="tab">Discover</span></nav></header><main class="page">${body}</main>`;
}
function workspace(done) {
  const c = counts();
  const sideLoc = `<aside class="side-loc panel pad"><div class="${done && S.leaf === 'Unsorted' || !done ? 'on' : ''}">Unsorted</div><div>Binders</div><div class="kid ${done && S.leaf === 'Binder 1' ? 'on' : ''}">Binder 1</div><div class="kid ${done && S.leaf === 'Binder 2' ? 'on' : ''}">Binder 2</div><div class="${done && S.leaf === 'Trade box' ? 'on' : ''}">Trade box</div><div>Decks</div><div class="kid">Gardevoir ex</div></aside>`;
  const empty = S.empty && !done;
  const main = empty
    ? `<div class="empty stack"><h2>Your Collection is empty</h2><p class="lede">Add cards from the catalog, or bring your collection over from another tracker.</p><div class="row" style="justify-content:center"><button class="btn primary" data-go="import">Import from another tracker</button><button class="btn">Add cards</button></div></div>`
    : `<div class="gallery">${Array.from({ length: 18 }, (_, k) => `<div class="tile"><span class="num">×${1 + k % 3}</span></div>`).join('')}</div>`;
  return shell(`<div class="pagehead"><div class="grow"><h1>${done ? S.leaf : 'Unsorted'}</h1><p class="lede num">${done ? fmt(c.cards + 212) + ' cards' : empty ? 'No cards yet' : '212 cards'}</p></div>
    ${empty ? '' : `<button class="btn">Add cards</button><button class="btn" data-go="import">Import…</button>`}</div>
    <div class="ws">${sideLoc}<div>${main}</div></div>
    ${done ? `<div class="toast"><span class="num">Added ${fmt(c.cards)} cards to ${S.leaf}.</span></div>` : ''}`);
}
function importScreen() {
  const fileBody = S.loaded
    ? `<div class="panel pad stack"><div class="row"><div class="art"></div><div><div class="nm">export.csv</div><div class="meta num">1,308 rows · 152 KB</div></div><button class="btn small quiet" data-act="unload" style="margin-left:auto">Remove</button></div></div>`
    : `<div class="drop"><div><div class="nm">Drop your export here</div><div class="meta">CSV, TSV or TXT, or a zip holding one</div></div><div class="row" style="justify-content:center"><button class="btn" data-act="load">Choose file</button><button class="btn small quiet" data-act="load">Use sample export</button></div></div>`;
  const pasteBody = `<textarea class="input" placeholder="Paste rows copied from a spreadsheet, or one card per line">3 Pikachu SVI 63\n2x Iono PAL 185\nCharizard #4 Base Set\nUmbreon VMAX Evolving Skies</textarea>`;
  return shell(`<div class="pagehead"><div class="grow"><h1>Import your collection</h1><p class="lede">Bring cards over from another tracker. Nothing is added until you've reviewed it.</p></div><button class="btn quiet" data-go="start">Cancel</button></div>
  <div class="imp-grid"><div class="stack">
    <div class="seg"><button aria-pressed="${S.source === 'file'}" data-src="file">Upload a file</button><button aria-pressed="${S.source === 'paste'}" data-src="paste">Paste</button></div>
    ${S.source === 'file' ? fileBody : pasteBody}
    <p class="meta">PrizeCheck keeps each card, its finish and how many you have. Condition, prices paid and notes aren't imported.</p>
    <details class="meta"><summary>How do I export from my tracker?</summary><p>Short per-tracker steps go here: TCGplayer app, Collectr, PriceCharting, TCG Collector, Dragon Shield and Sorted. <span class="proto-note">copy comes from the spec</span></p></details>
  </div>
  <div class="panel pad stack"><div class="lbl">Put cards in</div><select class="input" data-act="leaf">${LEAVES.map(l => `<option ${l === S.leaf ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <p class="meta">Everything goes here. You can sort cards into other Locations afterwards.</p>
    <button class="btn primary" ${S.source === 'file' && !S.loaded ? 'aria-disabled="true"' : 'data-go="review"'}>Review import</button></div></div>`);
}
function rowView(r) {
  const c = r.picked || r;
  let pill = '';
  if (r.skipped) pill = '<span class="pill">Skipped</span>';
  else if (r.status === 'pick' && !r.fixed) pill = '<span class="pill warn">Pick one</span>';
  else if (r.status === 'notfound' && !r.fixed) pill = '<span class="pill warn">Not found</span>';
  else if (r.status === 'cantread' && !r.fixed) pill = '<span class="pill danger">Can\'t read</span>';
  else if (r.status === 'name' && !r.fixed) pill = '<span class="pill gold">Matched by name</span>';
  else if (r.status === 'finish' && !r.finish) pill = '<span class="pill">Finish unknown</span>';
  const title = r.status === 'cantread' && !r.fixed ? `<span class="nm">${r.name}</span> <span class="meta">· no number</span>` : `<span class="q num">${r.qty}</span><span class="nm">${c.name}</span> <span class="meta num">· ${c.set} ${c.num}</span>`;
  const finishCtl = (NEEDS(r) || r.skipped) ? '' : `<select class="input" style="height:24px;font-size:12px" data-fin="${r.id}"><option value="" ${!r.finish ? 'selected' : ''}>Finish unknown</option>${FINISHES.map(f => `<option ${f === r.finish ? 'selected' : ''}>${f}</option>`).join('')}</select>`;
  const held = r.held && !r.skipped && !NEEDS(r) ? ` · <span class="num">${r.held} already in your Collection</span>` : '';
  let resolver = '';
  if (S.open === r.id && NEEDS(r)) {
    const cands = r.status === 'pick' ? [[r.name, r.set, r.num], [r.name, SETS[(r.id + 3) % SETS.length][0], 1 + r.id % 90]] : [];
    resolver = `<div class="resolver">${r.status === 'pick' ? `<div class="meta">${r.set} has two cards named ${r.name}.</div>` : r.status === 'notfound' ? `<div class="meta">We couldn't find this card. Search for it, or skip the row.</div>` : `<div class="meta">This row has no number we can read.</div>`}
      ${cands.map((k, j) => `<button class="cand" data-pick="${r.id}:${j}"><div class="art"></div><div><b>${k[0]}</b> <span class="meta num">${k[1]} ${k[2]}</span></div><span class="meta">Pick</span></button>`).join('')}
      <div class="row"><input class="input" style="flex:1" placeholder="Search the catalog" value="${r.name}"><button class="btn small" data-pick="${r.id}:0">Use first result</button><button class="btn small quiet" data-skip="${r.id}">Skip row</button></div></div>`;
  }
  return `<div class="ln ${NEEDS(r) ? 'problem' : ''} ${r.skipped ? 'skipped' : ''}">
    <input type="checkbox" data-sel="${r.id}" ${S.sel.has(r.id) ? 'checked' : ''} aria-label="Select row">
    <div class="art"></div>
    <div><div>${title}</div><div class="meta">${r.group}${held}</div><div class="mono subtle">${r.src}</div></div>
    <div class="row" style="justify-content:flex-end">${pill}${finishCtl}${NEEDS(r) ? `<button class="btn small" data-open="${r.id}">${S.open === r.id ? 'Close' : 'Fix'}</button>` : ''}${r.skipped ? `<button class="btn small quiet" data-unskip="${r.id}">Restore</button>` : ''}</div>
    ${resolver}</div>`;
}
function review() {
  const c = counts();
  const F = { needs: r => NEEDS(r), finish: r => r.status === 'finish' && !r.finish && !r.skipped, name: r => r.status === 'name' && !r.fixed && !r.skipped, all: r => !r.skipped, skipped: r => r.skipped };
  const list = incl().filter(F[S.filter]);
  const chips = [['needs', 'Needs you', c.needs], ['finish', 'Finish unknown', c.finish], ['name', 'Matched by name', c.name], ['all', 'All', c.all - c.skipped], ['skipped', 'Skipped', c.skipped]];
  const selN = S.sel.size;
  const bulk = selN ? `<div class="bulk"><b class="num">${selN} selected</b><select class="input" style="height:26px" data-act="bulkfin"><option value="">Set finish…</option>${FINISHES.map(f => `<option>${f}</option>`).join('')}</select><button class="btn small" data-act="bulkskip">Skip</button><button class="btn small quiet" data-act="clearsel">Clear</button></div>` : '';
  const listHead = `<div class="panel-h"><div class="filter">${chips.map(([k, l, n]) => `<button class="chip" aria-pressed="${S.filter === k}" data-filter="${k}">${l} <span class="num">${fmt(n)}</span></button>`).join('')}</div>
    <button class="btn small quiet" data-act="selall" style="margin-left:auto">Select all ${fmt(list.length)}</button>
    ${S.filter === 'needs' && c.needs ? `<button class="btn small" data-act="skipneeds">Skip all ${c.needs}</button>` : ''}</div>`;
  const body = list.length ? list.slice(0, S.shown).map(rowView).join('') + (list.length > S.shown ? `<div class="more"><button class="btn small" data-act="more">Show ${Math.min(100, list.length - S.shown)} more of ${fmt(list.length - S.shown)}</button></div>` : '')
    : `<div class="pad meta">${S.filter === 'needs' ? 'Nothing needs you. Every row is matched or skipped.' : 'No rows here.'}</div>`;
  const side = `<aside class="rv-side">
    <div class="panel pad stack"><div class="lbl">Put cards in</div><select class="input" data-act="leaf">${LEAVES.map(l => `<option ${l === S.leaf ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="panel pad stack"><div class="lbl">In this file</div>${GROUPS.map(([g, n]) => `<label class="grp"><input type="checkbox" data-grp="${g}" ${S.groups[g] ? 'checked' : ''}>${g}<span class="n num">${fmt(n)} rows</span></label>`).join('')}<p class="meta" style="margin:0">Untick a group to leave it out.</p></div>
    <div class="panel pad stack"><div class="lbl">Left out</div>${LEFT_OUT.map(([k, n]) => `<div class="lo"><span>${k}</span><span class="num muted">${n}</span></div>`).join('')}<div class="row"><button class="link" data-act="viewleft">View</button><button class="link" data-act="dl">Download</button></div></div>
    ${c.held ? `<div class="panel pad meta num">${fmt(c.held)} of these cards are already in your Collection. Importing adds to them.</div>` : ''}
  </aside>`;
  const ready = c.needs === 0;
  return shell(`<div class="pagehead"><div class="grow"><h1>Review import</h1><p class="lede num">export.csv · ${fmt(c.all)} rows</p></div><button class="btn quiet" data-go="import">Back</button></div>
    <div class="stats num"><div class="stat"><div class="lbl">Cards to add</div><div class="v">${fmt(c.cards)}</div></div><div class="stat"><div class="lbl">Needs you</div><div class="v ${c.needs ? 'warn' : ''}">${c.needs}</div></div><div class="stat"><div class="lbl">Finish unknown</div><div class="v">${fmt(c.finish)}</div></div><div class="stat"><div class="lbl">Skipped</div><div class="v">${c.skipped}</div></div></div>
    <div class="rv-grid"><div><div class="panel">${listHead}${bulk}${body}</div>
      <div class="savebar"><div class="grow num">${ready ? `Ready: ${fmt(c.cards)} cards from ${fmt(c.ready)} rows.` : `<span class="warn">${c.needs} rows need you.</span> Fix or skip them to continue.`}${c.finish ? ` <span class="muted">${fmt(c.finish)} with finish unknown can be fixed later.</span>` : ''}</div>
        ${c.skipped ? `<button class="btn small quiet" data-act="dl">Download skipped rows</button>` : ''}
        <button class="btn primary" ${ready ? 'data-go="done"' : 'aria-disabled="true"'}>Add ${fmt(c.cards)} cards to ${S.leaf}</button></div></div>${side}</div>`);
}
function modal() {
  if (S.modal !== 'left') return '';
  const ex = [['On a watchlist', 'Zeraora · Stellar Crown 151/142'], ['Sealed products', 'Ascended Heroes Elite Trainer Box'], ['From other games', 'Portgas.D.Ace (One Piece)'], ['Not in English', 'Oranguru · Pokemon Japanese Shield']];
  return `<div class="modal-bg" data-act="closemodal"><div class="modal" onclick="event.stopPropagation()"><div class="panel-h"><h3 style="flex:1">Left out of this import</h3><button class="btn small quiet" data-act="closemodal">Close</button></div><div class="pad stack">${ex.map(([k, e]) => `<div><div class="nm">${k}</div><div class="meta">${e} and more</div></div>`).join('')}<button class="btn small" data-act="dl">Download these rows</button></div></div></div>`;
}
function switcher() {
  const scr = [['start', 'Collection'], ['import', 'Import'], ['review', 'Review'], ['done', 'After saving']];
  return `<span class="t">Prototype</span>${scr.map(([k, l]) => `<button aria-pressed="${S.screen === k}" data-go="${k}">${l}</button>`).join('')}<button aria-pressed="${S.empty}" data-act="empty">Empty Collection</button><button aria-pressed="${S.frame}" data-act="frame">Phone frame</button><button data-act="reset">Reset</button>`;
}
function render() {
  document.getElementById('stage').className = S.frame ? 'framed' : '';
  const v = { start: () => workspace(false), import: importScreen, review, done: () => workspace(true) }[S.screen];
  document.getElementById('app').innerHTML = v();
  document.getElementById('modal').innerHTML = modal();
  document.getElementById('sw').innerHTML = switcher();
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act],[data-filter],[data-open],[data-skip],[data-unskip],[data-pick],[data-src]');
  if (!t || t.tagName === 'SELECT') return;
  const d = t.dataset;
  if (d.go) { if (d.go === 'review') S.loaded = true; return go(d.go); }
  if (d.src) { S.source = d.src; return render(); }
  if (d.filter) { S.filter = d.filter; S.shown = 100; S.sel.clear(); return render(); }
  if (d.open) { S.open = S.open === +d.open ? null : +d.open; return render(); }
  if (d.skip) { S.rows[+d.skip].skipped = true; S.open = null; return render(); }
  if (d.unskip) { S.rows[+d.unskip].skipped = false; return render(); }
  if (d.pick) { const [id, j] = d.pick.split(':').map(Number); const r = S.rows[id]; r.fixed = true; r.finish = r.finish || 'Normal'; if (j === 1) r.picked = { name: r.name, set: SETS[(id + 3) % SETS.length][0], num: 1 + id % 90 }; S.open = null; return render(); }
  const a = d.act;
  if (a === 'load') { S.loaded = true; return render(); }
  if (a === 'unload') { S.loaded = false; return render(); }
  if (a === 'more') { S.shown += 100; return render(); }
  if (a === 'selall') { const F = { needs: NEEDS, finish: r => r.status === 'finish' && !r.finish && !r.skipped, name: r => r.status === 'name' && !r.fixed && !r.skipped, all: r => !r.skipped, skipped: r => r.skipped }[S.filter]; incl().filter(F).forEach(r => S.sel.add(r.id)); return render(); }
  if (a === 'clearsel') { S.sel.clear(); return render(); }
  if (a === 'bulkskip') { S.sel.forEach(id => S.rows[id].skipped = true); S.sel.clear(); return render(); }
  if (a === 'skipneeds') { incl().filter(NEEDS).forEach(r => r.skipped = true); return render(); }
  if (a === 'viewleft') { S.modal = 'left'; return render(); }
  if (a === 'closemodal') { S.modal = null; return render(); }
  if (a === 'dl') { alert('Prototype: this would download the rows as a CSV, in the file\'s own columns.'); return; }
  if (a === 'undo') { S.screen = 'start'; setURL(); render(); return; }
  if (a === 'empty') { S.empty = !S.empty; setURL(); return render(); }
  if (a === 'frame') { S.frame = !S.frame; setURL(); return render(); }
  if (a === 'reset') { location.search = ''; }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.sel) { t.checked ? S.sel.add(+d.sel) : S.sel.delete(+d.sel); return render(); }
  if (d.grp) { S.groups[d.grp] = t.checked; return render(); }
  if (d.fin !== undefined) { S.rows[+d.fin].finish = t.value || null; return render(); }
  if (d.act === 'leaf') { S.leaf = t.value; return render(); }
  if (d.act === 'bulkfin' && t.value) { S.sel.forEach(id => { const r = S.rows[id]; if (!NEEDS(r) && !r.skipped) r.finish = t.value; }); S.sel.clear(); return render(); }
});
if (S.screen === 'review') { S.loaded = true; S.filter = 'needs'; }
render();
</script>
</body>
</html>
