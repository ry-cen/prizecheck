# Same-origin entry point: static SPA plus /auth and /api through the Better Auth gateway.
# Mirrors scripts/release_runtime.py routing. No access log: /published/<token> URLs are capability links.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    # nginx error lines include the request line, which can carry a token; only log failures of nginx itself.
    error_log /dev/stderr crit;
    log_not_found off;

    root /usr/share/nginx/html;
    # 64k is the largest body the gateway takes on any route but Collection Import's start route (auth/src/server.ts
    # IMPORT_ROUTES), which alone gets more, in its own location below.
    client_max_body_size 64k;

    # Docker's embedded DNS; re-resolve so a recreated gateway container is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://auth:3001;

    # Production only (compose.prod.yml pins this edge gateway): host Caddy reaches nginx through Docker's port
    # proxy from 10.201.80.1 and sends the visitor's address in X-Real-IP. Elsewhere no peer has this address,
    # so $remote_addr stays the real peer; dev's gateway trusts no forwarded address anyway (TRUSTED_PROXY_IPS "").
    set_real_ip_from 10.201.80.1;
    real_ip_header X-Real-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location ~ ^/(api|auth)/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # The gateway trusts X-Real-IP only from the peers in TRUSTED_PROXY_IPS (production: this container's fixed
        # address), and nginx always overwrites it with the realip-resolved address. X-Forwarded-For and the internal
        # identity headers are stripped.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Internal-User "";
        proxy_set_header X-Internal-Time "";
        proxy_set_header X-Internal-Signature "";
        proxy_set_header X-Internal-Caller "";
        proxy_set_header X-Internal-Budget-Ms "";
        proxy_set_header X-Internal-Budget-Time "";
        proxy_set_header X-Internal-Budget-Signature "";
        proxy_read_timeout 60s;
        # Deck exports stream from the gateway; don't spool them into the tmpfs.
        proxy_buffering off;
    }

    # Collection Import's start route alone takes the collector's file, up to the gateway's and the API's 5 MiB (nginx's
    # 5m). An exact match wins over the regex location above whatever the query (location_id). Every proxy directive
    # repeats the location above, the identity-header strips included: keep the two in step
    # (tests/tooling/test_proxy_config.py checks).
    location = /api/collection-imports {
        client_max_body_size 5m;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Internal-User "";
        proxy_set_header X-Internal-Time "";
        proxy_set_header X-Internal-Signature "";
        proxy_set_header X-Internal-Caller "";
        proxy_set_header X-Internal-Budget-Ms "";
        proxy_set_header X-Internal-Budget-Time "";
        proxy_set_header X-Internal-Budget-Signature "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # The card scanner's own page (spec "Web and delivery", Header scope): the one HTML document that is cross-origin
    # isolated, which the threaded WASM runtime needs. No other document sends COOP or COEP. The directives repeat the
    # other locations': nginx shares none of them.
    location = /collection/scan {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files /scan.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # The scanner entry is served only at /collection/scan, never by its file name.
    location = /scan.html {
        return 404;
    }

    # The scanner's pinned models (scripts/fetch-scanner-models.mjs, web/scanner-models.lock.json): content-addressed
    # paths, so they never change under a URL.
    location ^~ /scanner/m/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri =404;
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_types application/octet-stream text/plain;
        # No `always` on Cache-Control: a 404 must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # COEP require-corp on /assets/ responses: the isolated scanner page loads its worker script and the runtime's glue
    # from here, and a worker carries its own embedder policy. It has no effect on the main app's documents.
    location /assets/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri =404;
        gzip on;
        gzip_vary on;
        gzip_types application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # ES module files (the onnxruntime-web glue imported with ?url keeps .mjs); nginx's mime.types has no mjs and a
        # types {} block would replace the whole map. if, try_files and add_header are not inherited: repeat each.
        location ~* \.mjs$ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            try_files $uri =404;
            default_type text/javascript;
            gzip on;
            gzip_vary on;
            gzip_types text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
