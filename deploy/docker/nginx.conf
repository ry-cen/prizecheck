# Same-origin entry point: static SPA plus /auth and /api through the Better Auth gateway.
# Mirrors scripts/release_runtime.py routing. No access log: /published/<token> URLs are capability links.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    # nginx error lines include the request line, which can carry a token; only log failures of nginx itself.
    error_log /dev/stderr crit;
    log_not_found off;

    root /usr/share/nginx/html;
    # 64k is the largest body the gateway takes on any route but Collection Import's start route (auth/src/server.ts
    # IMPORT_ROUTES), which alone gets more, in its own location below.
    client_max_body_size 64k;

    # Docker's embedded DNS; re-resolve so a recreated gateway container is found at its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://auth:3001;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location ~ ^/(api|auth)/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # The gateway trusts no forwarding header (TRUSTED_PROXY_IPS is empty) and builds its own internal
        # identity headers; strip client-supplied ones anyway.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Internal-User "";
        proxy_set_header X-Internal-Time "";
        proxy_set_header X-Internal-Signature "";
        proxy_set_header X-Internal-Caller "";
        proxy_set_header X-Internal-Budget-Ms "";
        proxy_set_header X-Internal-Budget-Time "";
        proxy_set_header X-Internal-Budget-Signature "";
        proxy_read_timeout 60s;
        # Deck exports stream from the gateway; don't spool them into the tmpfs.
        proxy_buffering off;
    }

    # Collection Import's start route alone takes the collector's file, up to the gateway's and the API's 5 MiB (nginx's
    # 5m). An exact match wins over the regex location above whatever the query (location_id). Every proxy directive
    # repeats the location above, the identity-header strips included: keep the two in step
    # (tests/tooling/test_proxy_config.py checks).
    location = /api/collection-imports {
        client_max_body_size 5m;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Internal-User "";
        proxy_set_header X-Internal-Time "";
        proxy_set_header X-Internal-Signature "";
        proxy_set_header X-Internal-Caller "";
        proxy_set_header X-Internal-Budget-Ms "";
        proxy_set_header X-Internal-Budget-Time "";
        proxy_set_header X-Internal-Budget-Signature "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /assets/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
